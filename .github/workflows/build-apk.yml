              }

              @Override
              public int read() throws IOException {
                byte[] one = new byte[1];
                int n = read(one, 0, 1);
                return n < 0 ? -1 : (one[0] & 0xff);
              }

              @Override
              public int read(byte[] b, int off, int len) throws IOException {
                if (len == 0) return 0;
                lastRead = System.currentTimeMillis();
                if (cur == null) {
                  if (done) return -1;
                  byte[] nx;
                  try { nx = q.poll(30, java.util.concurrent.TimeUnit.SECONDS); } catch (InterruptedException e) { throw new IOException("interrupted"); }
                  if (nx == null) throw new IOException("read-ahead timeout");
                  if (nx == END) { done = true; if (err != null) throw err; return -1; }
                  cur = nx;
                  pos = 0;
                }
                int k = Math.min(len, cur.length - pos);
                System.arraycopy(cur, pos, b, off, k);
                pos += k;
                if (pos >= cur.length) cur = null;
                return k;
              }

              @Override
              public int available() { return cur == null ? 0 : cur.length - pos; }

              @Override
              public void close() {
                closed = true;
                q.clear();
                q.offer(END);
                cut();
              }
            }

            private static HttpURLConnection agConn(String url, String ref, String ua, String rng, int connectMs) throws IOException {
              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
              c.setConnectTimeout(connectMs);
              c.setReadTimeout(10000);
              c.setInstanceFollowRedirects(true);
              c.setRequestProperty("User-Agent", (ua != null && ua.length() > 0) ? ua : "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");
              if (ref != null && ref.length() > 0) c.setRequestProperty("Referer", ref);
              if (rng != null && rng.length() > 0) c.setRequestProperty("Range", rng);
              c.setRequestProperty("Accept", "*/*");
              c.setRequestProperty("Accept-Encoding", "identity");
              return c;
            }

            private static HttpURLConnection agTry(String url, String ref, String ua, String rng, int connectMs) {
              try {
                HttpURLConnection c = agConn(url, ref, ua, rng, connectMs);
                int code = c.getResponseCode();
                if (code == 200 || code == 206) return c;
                c.disconnect();
              } catch (Exception ignored) { }
              return null;
            }

            /* upstream does not do ranges: pass the single stream through (still read ahead) */
            private static AgFeed agPassFeed(final HttpURLConnection c) {
              return new AgFeed() {
                @Override
                public void feed(ReadAhead ra) throws Exception {
                  ra.live = c;
                  java.io.InputStream in = c.getInputStream();
                  byte[] b = new byte[AG_PIECE];
                  int n;
                  while (!ra.isClosed() && (n = in.read(b)) >= 0) {
                    if (n == 0) continue;
                    if (!ra.push(java.util.Arrays.copyOf(b, n))) return;
                  }
                }
              };
            }

            private static AgFeed agChunkFeed(final HttpURLConnection first, final String base, final String ref, final String ua,
                                              final long s, final long end, final int connectMs) {
              return new AgFeed() {
                @Override
                public void feed(ReadAhead ra) throws Exception {
                  long pos = s;
                  HttpURLConnection c = first;
                  boolean firstChunk = true;
                  int fails = 0;
                  while (pos <= end && !ra.isClosed()) {
                    if (c == null) {
                      long to = Math.min(end, pos + AG_CHUNK - 1);
                      try {
                        c = agConn(base, ref, ua, "bytes=" + pos + "-" + to, connectMs);
                        ra.live = c;
                        int code = c.getResponseCode();
                        if (code != 206) throw new IOException("chunk http " + code);
                      } catch (IOException e) {
                        try { if (c != null) c.disconnect(); } catch (Throwable ignored) { }
                        c = null;
                        ra.live = null;
                        if (ra.isClosed() || ++fails > 2) throw e;
                        continue;
                      }
                    }
                    ra.live = c;
                    java.io.InputStream in = c.getInputStream();
                    long before = pos;
                    byte[] b = new byte[AG_PIECE];
                    int n;
                    if (firstChunk) {
                      /* streamed live: playback starts as soon as the first bytes arrive */
                      while (!ra.isClosed() && (n = in.read(b)) >= 0) {
                        if (n == 0) continue;
                        if (!ra.push(java.util.Arrays.copyOf(b, n))) return;
                        pos += n;
                      }
                    } else {
                      /* read in full first, so the connection returns to the pool before the data is handed over */
                      java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream(AG_CHUNK);
                      while (!ra.isClosed() && (n = in.read(b)) >= 0) bo.write(b, 0, n);
                      if (ra.isClosed()) return;
                      try { in.close(); } catch (Throwable ignored) { }
                      ra.live = null;
                      byte[] all = bo.toByteArray();
                      for (int o = 0; o < all.length; o += AG_PIECE) {
                        if (!ra.push(java.util.Arrays.copyOfRange(all, o, Math.min(all.length, o + AG_PIECE)))) return;
                      }
                      pos += all.length;
                    }
                    try { in.close(); } catch (Throwable ignored) { }
                    ra.live = null;
                    c = null;
                    firstChunk = false;
                    if (pos == before && ++fails > 2) throw new IOException("empty chunk");
                  }
                }
              };
            }

            private WebResourceResponse agOpen(String target, String ref, String ua, String range, int connectMs) {
              try {
                if (target == null || !(target.startsWith("https://") || target.startsWith("http://"))) return null;
                long s = 0, e = -1;
                boolean ranged = false;
                if (range != null && range.startsWith("bytes=") && range.indexOf(',') < 0) {
                  String[] a = range.substring(6).trim().split("-", -1);
                  if (a.length == 2 && a[0].trim().length() > 0) {
                    try {
                      s = Long.parseLong(a[0].trim());
                      e = a[1].trim().length() > 0 ? Long.parseLong(a[1].trim()) : -1;
                      ranged = (e < 0 || e >= s);
                    } catch (Exception x) { ranged = false; }
                  }
                }
                long firstTo = (e >= 0) ? Math.min(e, s + AG_FIRST - 1) : (s + AG_FIRST - 1);
                String rng = ranged ? ("bytes=" + s + "-" + firstTo) : range;
                HttpURLConnection c = null;
                String cached = AG_FINAL.get(target);
                if (cached != null) {
                                  c = agTry(cached, ref, ua, rng, connectMs);
                  if (c == null) AG_FINAL.remove(target);
                }
                                if (c == null) c = agTry(target, ref, ua, rng, connectMs);
                if (c == null) return null;
                int code = c.getResponseCode();
                String base = target;
                try {
                  String fin = c.getURL().toString();
                  if (fin != null && fin.startsWith("http")) {
                    base = fin;
                    if (!fin.equals(target)) { if (AG_FINAL.size() > 64) AG_FINAL.clear(); AG_FINAL.put(target, fin); }
                  }
                } catch (Throwable ignored) { }
                String ct = c.getContentType();
                String mime = "video/mp4";
                if (ct != null) { String m = ct.split(";")[0].trim(); if (m.startsWith("video/")) mime = m; }
                Map<String, String> h = new HashMap<>();
                h.put("Accept-Ranges", "bytes");
                h.put("Access-Control-Allow-Origin", "*");
                long total = -1;
                String cr = c.getHeaderField("Content-Range");
                if (code == 206 && cr != null) {
                  int sl = cr.lastIndexOf('/');
                  if (sl > 0) { try { total = Long.parseLong(cr.substring(sl + 1).trim()); } catch (Exception ignored) { } }
                }
                if (ranged && code == 206 && total > 0 && s < total) {
                  long end = (e >= 0) ? Math.min(e, total - 1) : (total - 1);
                  h.put("Content-Length", String.valueOf(end - s + 1));
                  h.put("Content-Range", "bytes " + s + "-" + end + "/" + total);
                  ReadAhead ra = new ReadAhead(agChunkFeed(c, base, ref, ua, s, end, connectMs), 128);
                  return new WebResourceResponse(mime, null, 206, "Partial Content", h, ra);
                }
                if (ranged && code == 200 && s > 0) { c.disconnect(); return null; }
                /* no range support (or an unranged request): single stream, still read ahead */
                String cl = c.getHeaderField("Content-Length");
                if (cl != null) h.put("Content-Length", cl);
                if (cr != null) h.put("Content-Range", cr);
                return new WebResourceResponse(mime, null, code, code == 206 ? "Partial Content" : "OK", h, new ReadAhead(agPassFeed(c), 128));
              } catch (Exception ex) {
                return null;
              }
            }

            private WebResourceResponse agProxy(WebResourceRequest rq) {
              Uri u = rq.getUrl();
              String range = null;
              Map<String, String> rh = rq.getRequestHeaders();
              if (rh != null) for (Map.Entry<String, String> e : rh.entrySet()) if ("range".equalsIgnoreCase(e.getKey())) range = e.getValue();
              String tgt = u.getQueryParameter("u");
              String host = "";
              try { host = Uri.parse(tgt).getHost(); if (host == null) host = ""; } catch (Exception e) { }
              Long bad = AG_BAD.get(host);
              WebResourceResponse r = null;
              /* direct route: short connect wait; if it fails, skip it for 30 s after two failures in a row and go straight to the relay */
              if (bad == null || System.currentTimeMillis() > bad) {
                r = agOpen(tgt, u.getQueryParameter("r"), u.getQueryParameter("ua"), range, 3500);
                if (r == null) { Integer f0 = AG_FAILS.get(host); int nf = (f0 == null ? 0 : f0) + 1; AG_FAILS.put(host, nf); if (nf >= 2) AG_BAD.put(host, System.currentTimeMillis() + 30000L); } else { AG_BAD.remove(host); AG_FAILS.remove(host); }
              }
              if (r == null) r = agOpen(u.getQueryParameter("fb"), null, null, range, 8000);
              if (r == null) return new WebResourceResponse("text/plain", "utf-8", 502, "Bad Gateway", new HashMap<String, String>(), new java.io.ByteArrayInputStream(new byte[0]));
              return r;
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              /* folder picker for Export / Import of downloaded videos */
              final androidx.activity.result.ActivityResultLauncher<Uri> treeLauncher = registerForActivityResult(
                new androidx.activity.result.contract.ActivityResultContracts.OpenDocumentTree(),
                uri -> AnimeDL.onPicked(uri));
              AnimeDL.picker = mode -> runOnUiThread(() -> treeLauncher.launch(null));
              if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1001);
              }
              final Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = w.getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                w.setAttributes(lp);
              }
              WindowInsetsControllerCompat ic = WindowCompat.getInsetsController(w, w.getDecorView());
              ic.setAppearanceLightStatusBars(false);
              ic.setAppearanceLightNavigationBars(false);

              final WebView wv = getBridge().getWebView();
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public String get() { return saTop + "," + saBottom; }
              }, "AnimeInsets");

              getBridge().setWebViewClient(new BridgeWebViewClient(getBridge()) {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  try {
                    Uri u = request.getUrl();
                    if ("localhost".equals(u.getHost()) && "/__ag".equals(u.getPath())) return agProxy(request);
                    if ("localhost".equals(u.getHost()) && u.getPath() != null && u.getPath().startsWith("/__dl/")) {
                      WebResourceResponse dl = AnimeDL.serve(MainActivity.this, request);
                      if (dl != null) return dl;
                    }
                  } catch (Exception e) { }
                  return super.shouldInterceptRequest(view, request);
                }
              });
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public boolean ok() { return true; }
              }, "AnimeProxy");
              wv.addJavascriptInterface(new AnimeDL(this), "AnimeDL");

              ViewCompat.setOnApplyWindowInsetsListener(w.getDecorView(), (v, insets) -> {
                Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                float d = getResources().getDisplayMetrics().density;
                saTop = Math.round(b.top / d);
                saBottom = Math.round(b.bottom / d);
                final String js = "(function(){var s=document.documentElement.style;s.setProperty('--sa-top','" + saTop + "px');s.setProperty('--sa-bottom','" + saBottom + "px')})()";
                wv.post(() -> wv.evaluateJavascript(js, null));
                return ViewCompat.onApplyWindowInsets(v, insets);
              });

              fsBack = new OnBackPressedCallback(false) {
                @Override
                public void handleOnBackPressed() { exitCustom(); }
              };
              getOnBackPressedDispatcher().addCallback(this, fsBack);

              wv.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                @Override
                public void onShowCustomView(View view, WebChromeClient.CustomViewCallback cb) {
                  if (customView != null) { cb.onCustomViewHidden(); return; }
                  customView = view;
                  customCb = cb;
                  view.setBackgroundColor(Color.BLACK);
                              ((ViewGroup) getWindow().getDecorView()).addView(view,
                    new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  fsBack.setEnabled(true);
                }

                @Override
                public void onHideCustomView() { exitCustom(); }
              });
            }

            private void exitCustom() {
              if (customView == null) return;
              View v = customView;
              WebChromeClient.CustomViewCallback cb = customCb;
              customView = null;
              customCb = null;
              fsBack.setEnabled(false);
              if (v.getParent() instanceof ViewGroup) ((ViewGroup) v.getParent()).removeView(v);
              WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).show(WindowInsetsCompat.Type.systemBars());
              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
              if (cb != null) cb.onCustomViewHidden();
            }
          }
