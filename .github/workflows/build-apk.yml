name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_PASS: ${{ secrets.KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make signing key (first run only)
        run: |
          if [ ! -f release.keystore.enc ]; then
            keytool -genkeypair -keystore release.keystore -alias animeshelf -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AnimeShelf" -storepass:env KEY_PASS -keypass:env KEY_PASS
            openssl enc -aes-256-cbc -pbkdf2 -salt -in release.keystore -out release.keystore.enc -pass env:KEY_PASS
            rm release.keystore
            git config user.name github-actions
            git config user.email actions@github.com
            git add release.keystore.enc
            git commit -m "Add signing key"
            git push
          fi
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html native.js manifest.webmanifest www/
          cp -r icons www/
          sed -i -E 's/env\(safe-area-inset-(top|bottom), *0(px)?\)/var(--sa-\1,0px)/g' www/index.html
          echo '<script src="native.js"></script>' >> www/index.html
          if [ -f google-services.json ]; then sed -i 's/const NB_FCM=false/const NB_FCM=true/' www/index.html; echo "Firebase push: ON"; else echo "Firebase push: off (no google-services.json in the repo)"; fi
      - run: npm install
      - name: Notification plugin
        run: |
          V=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/local-notifications@$V
          if [ -f google-services.json ]; then npm install @capacitor/push-notifications@$V; fi
      - run: npx cap add android
      - name: Firebase config (only if google-services.json exists)
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json copied"; fi
      - name: App icon (from icon-192.png)
        continue-on-error: true
        run: |
          pip install pillow -q
          python3 - <<'PY'
          import os
          from PIL import Image
          best = 'icons/icon-192.png'
          if not os.path.exists(best):
              print('icon-192.png not found, keeping default')
              raise SystemExit(0)
          print('Using icon:', best)
          im = Image.open(best).convert('RGBA')
          px = im.getpixel((3, 3))
          bg = (13, 15, 25) if px[3] < 128 else px[:3]
          hexc = '#%02X%02X%02X' % bg
          print('Icon background:', hexc)
          res = 'android/app/src/main/res'
          dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for n, (l, f) in dens.items():
              d = res + '/mipmap-' + n
              os.makedirs(d, exist_ok=True)
              ic = im.resize((l, l), Image.LANCZOS)
              ic.save(d + '/ic_launcher.png')
              ic.save(d + '/ic_launcher_round.png')
              inner = int(f * 0.75)
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              fg.paste(im.resize((inner, inner), Image.LANCZOS), ((f - inner) // 2, (f - inner) // 2))
              fg.save(d + '/ic_launcher_foreground.png')
          os.makedirs(res + '/values', exist_ok=True)
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n <color name="ic_launcher_background">' + hexc + '</color>\n</resources>\n')
          adaptive = ('<?xml version="1.0" encoding="utf-8"?>\n'
                      '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                      ' <background android:drawable="@color/ic_launcher_background"/>\n'
                      ' <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                      '</adaptive-icon>\n')
          for x in ('ic_launcher', 'ic_launcher_round'):
              open(res + '/mipmap-anydpi-v26/' + x + '.xml', 'w').write(adaptive)
          print('icon done')
          PY
      - name: Manifest (local player server + background download service)
        run: |
          PKG=$(node -p "require('./capacitor.config.json').appId")
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"
          if ! grep -q FOREGROUND_SERVICE_DATA_SYNC "$M"; then
            sed -i 's#</manifest>#<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.WAKE_LOCK"/></manifest>#' "$M"
          fi
          grep -q DownloadService "$M" || sed -i "s#</application>#<service android:name=\"$PKG.DownloadService\" android:exported=\"false\" android:foregroundServiceType=\"dataSync\"/></application>#" "$M"
          cat "$M"
      - name: Episode downloader (AnimeDL.java)
        run: |
          PKG=$(node -p "require('./capacitor.config.json').appId")
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          DIR=$(dirname "$MAIN")
          echo "package $PKG;" > "$DIR/AnimeDL.java"
          cat >> "$DIR/AnimeDL.java" <<'JEOF'

          import android.content.ContentResolver;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.DocumentsContract;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.io.RandomAccessFile;
          import java.net.HttpURLConnection;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.net.URL;
          import java.nio.ByteBuffer;
          import java.nio.channels.FileChannel;
          import java.security.SecureRandom;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.util.concurrent.atomic.AtomicLong;
          import java.util.concurrent.atomic.AtomicReference;

          /* Episode downloader.
             - downloads with several parallel connections (HTTP Range blocks) straight into one file, so it is
               many times faster than Android's DownloadManager (which uses ONE connection); falls back to a
               single stream when the server has no Range support
             - serves the finished files to the WebView through a tiny local HTTP server (127.0.0.1) that
               fully supports Range requests, so seeking in the player is instant and needs no internet */
          public class AnimeDL {
            private static final String SUBDIR = "ShelfAnime";
            private static final int CONNS = 8;
            private static final int BLOCK = 1024 * 1024;
            private static final String UA_DEF = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
            private static final ExecutorService POOL = Executors.newCachedThreadPool();

            private static ServerSocket srv;
            private static int port;
            private static String token = "";

            private final Context ctx;
            private final ConcurrentHashMap<String, Job> jobs = new ConcurrentHashMap<>();

            public AnimeDL(Context c) {
              ctx = c.getApplicationContext();
              appCtx = ctx;
              startServer(ctx);
            }

            private static File dir(Context c) {
              File base = c.getExternalFilesDir(Environment.DIRECTORY_MOVIES);
              File d = new File(base, SUBDIR);
              if (!d.exists()) d.mkdirs();
              return d;
            }
                        private static String safe(String id) { return id == null ? "" : id.replaceAll("[^A-Za-z0-9_\\-]", "_"); }
            private File finFile(String id) { return new File(dir(ctx), safe(id) + ".mp4"); }
            private File partFile(String id) { return new File(dir(ctx), safe(id) + ".part"); }

            @JavascriptInterface public boolean ok() { return true; }

            /* e.g. http://127.0.0.1:41234/ab12cd... (empty string if the local server could not start) */
            @JavascriptInterface
            public String base() {
              return (srv != null && port > 0) ? ("http://127.0.0.1:" + port + "/" + token) : "";
            }

            @JavascriptInterface
            public long size(String id) {
              try { File f = finFile(id); return f.exists() ? f.length() : 0L; } catch (Throwable t) { return 0L; }
            }

            @JavascriptInterface
            public String start(String id, String url, String referer, String ua, String fileName) {
              try {
                cancelQuiet(id);
                Job j = new Job(safe(id), url, referer, (ua != null && ua.length() > 0) ? ua : UA_DEF);
                j.label = (fileName != null) ? fileName : "";
                jobs.put(safe(id), j);
                POOL.execute(j);
                DownloadService.begin(ctx);
                return "ok";
              } catch (Throwable t) {
                return "error: " + t;
              }
            }

            @JavascriptInterface
            public String status(String id) {
              Job j = jobs.get(safe(id));
              if (j == null) {
                File f = finFile(id);
                if (f.exists() && f.length() > 0) return "{\"st\":\"ok\",\"got\":" + f.length() + ",\"total\":" + f.length() + "}";
                return "{\"st\":\"none\",\"got\":0,\"total\":0}";
              }
              return "{\"st\":\"" + j.st + "\",\"got\":" + j.got.get() + ",\"total\":" + j.total + "}";
            }

            @JavascriptInterface
            public void cancel(String id) {
              cancelQuiet(id);
              svcCheck();
            }

            /* background service (keeps downloads alive when the app is not on screen) */
            private void svcProgress() {
              try {
                int n = 0; long g = 0, t = 0;
                for (Job j : jobs.values()) if ("run".equals(j.st) && !j.cancelled) { n++; g += j.got.get(); t += j.total; }
                if (n > 0) DownloadService.progress(ctx, n, t > 0 ? (int) Math.min(100, g * 100 / t) : -1);
              } catch (Throwable ignored) { }

                          }
            private void svcCheck() {
              try {
                for (Job j : jobs.values()) if ("run".equals(j.st) && !j.cancelled) return;
                DownloadService.end(ctx);
              } catch (Throwable ignored) { }
            }

                        private void cancelQuiet(String id) {
              try {
                Job j = jobs.remove(safe(id));
                if (j != null) j.abort();
              } catch (Throwable ignored) { }
              try { File f = partFile(id); if (f.exists()) f.delete(); } catch (Throwable ignored) { }
              try { File f = finFile(id); if (f.exists()) f.delete(); } catch (Throwable ignored) { }
            }

            @JavascriptInterface
            public void remove(String id) { cancel(id); }
                        /* ================= export / import to a folder the user picks (survives uninstall) ================= */
            public interface Picker { void pick(String mode); }
            public static volatile Picker picker;
            private static volatile Context appCtx;
            private static final String XF_FOLDER = "AnimeShelf Downloads";
            private static final String XF_MANIFEST = "animeshelf-downloads.json";
            private static final Pattern XF_ID1 = Pattern.compile("\\[([A-Za-z0-9_\\-]+)\\]\\.mp4$");
            private static final Pattern XF_ID2 = Pattern.compile("^([A-Za-z0-9_\\-]+)\\.mp4$");
            private static volatile String xSt = "idle", xMode = "", xCur = "", xErr = "", xPayload = "", xManifest = "";
            private static volatile int xFiles = 0, xDone = 0, xSkip = 0, xBad = 0;
            private static volatile long xTotal = 0;
            private static final AtomicLong xGot = new AtomicLong(0);
            private static volatile boolean xCancel = false;
            private static volatile List<String[]> xItems = null;   /* import: {docId, displayName, safeId, size} */
            private static volatile Uri xTree = null;
            private static volatile String xManId = null;

            /* mode = "export" | "import"; payload = JSON the page wants stored next to the videos (export only) */
            @JavascriptInterface
            public String pickFolder(String mode, String payload) {
              if ("run".equals(xSt)) return "busy";
              Picker p = picker;
              if (p == null) return "unsupported";
              xMode = "import".equals(mode) ? "import" : "export";
              xPayload = payload == null ? "" : payload;
              xManifest = ""; xErr = ""; xCur = ""; xFiles = 0; xDone = 0; xSkip = 0; xBad = 0; xTotal = 0; xGot.set(0); xCancel = false;
              xSt = "pick";
              try { p.pick(xMode); return "ok"; } catch (Throwable t) { xSt = "fail"; xErr = String.valueOf(t); return "error"; }
            }

            @JavascriptInterface
            public String xferStatus() {
              try {
                JSONObject o = new JSONObject();
                o.put("st", xSt); o.put("mode", xMode); o.put("cur", xCur); o.put("err", xErr);
                o.put("files", xFiles); o.put("done", xDone); o.put("skip", xSkip); o.put("bad", xBad);
                o.put("got", xGot.get()); o.put("total", xTotal);
                if ("ok".equals(xSt)) o.put("manifest", xManifest);
              if ("list".equals(xSt)) {
                JSONArray a = new JSONArray();
                List<String[]> it = xItems;
                if (it != null) for (String[] k : it) {
                  JSONObject j = new JSONObject();
                  j.put("id", k[2]); j.put("name", k[1]); j.put("size", Long.parseLong(k[3]));
                  a.put(j);
                }
                o.put("items", a);
                o.put("manifest", xManifest);
              }
                return o.toString();
              } catch (Throwable t) { return "{\"st\":\"idle\"}"; }
            }

            @JavascriptInterface
            public void xferCancel() { xCancel = true; }

            /* import step 2: the user ticked some of the listed videos; ids = JSON array of the safe ids */
            @JavascriptInterface
            public String importSelected(String idsJson) {
              if (!"list".equals(xSt) || xItems == null || xTree == null) return "bad";
              final List<String[]> sel = new ArrayList<>();
                            long t = 0;
              try {
                JSONArray a = new JSONArray(idsJson);
                java.util.HashSet<String> want = new java.util.HashSet<>();
                for (int i = 0; i < a.length(); i++) want.add(a.getString(i));
                for (String[] k : xItems) if (want.contains(k[2])) { sel.add(k); t += Long.parseLong(k[3]); }
              } catch (Throwable e) { return "bad"; }
              if (sel.isEmpty()) return "empty";
              xDone = 0; xBad = 0; xGot.set(0); xCancel = false; xCur = ""; xErr = "";
              xFiles = sel.size(); xTotal = t;
              xSt = "run";
              POOL.execute(new Runnable() {
                public void run() {
                  try {
                    doImportRun(sel);
                    xSt = xCancel ? "cancel" : "ok";
                  } catch (Throwable e) {
                    xSt = "fail"; xErr = String.valueOf(e.getMessage() != null ? e.getMessage() : e);
                  }
                }
              });
              return "ok";
            }

            @JavascriptInterface
            public void importCancel() {
              if ("list".equals(xSt) || "scan".equals(xSt)) { xCancel = true; xSt = "idle"; xItems = null; }
            }

            /* called by MainActivity with the folder the user picked (null = picker dismissed) */
            public static void onPicked(final Uri tree) {
              if (tree == null) { xSt = "idle"; return; }
              if (appCtx == null) { xSt = "fail"; xErr = "not ready"; return; }
              final boolean exp = !"import".equals(xMode);
              xSt = exp ? "run" : "scan";
              POOL.execute(new Runnable() {
                public void run() {
                  try {
                    if (exp) { doExport(tree); xSt = xCancel ? "cancel" : "ok"; }
                    else { doScan(tree); xSt = "list"; }
                  } catch (Throwable t) {
                    xSt = "fail"; xErr = String.valueOf(t.getMessage() != null ? t.getMessage() : t);
                  }
                }
              });
            }
                        private static String xfId(String name) {
              if (name == null) return null;
              Matcher m = XF_ID1.matcher(name);
              if (m.find()) return m.group(1);
              m = XF_ID2.matcher(name);
              if (m.find()) return m.group(1);
              return null;
            }

            private static List<String[]> xfKids(ContentResolver cr, Uri tree, String parentDocId) {
              List<String[]> out = new ArrayList<>();
              Uri q = DocumentsContract.buildChildDocumentsUriUsingTree(tree, parentDocId);
              Cursor c = null;
              try {
                c = cr.query(q, new String[]{DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME, DocumentsContract.Document.COLUMN_MIME_TYPE, DocumentsContract.Document.COLUMN_SIZE}, null, null, null);
                while (c != null && c.moveToNext()) {
                  long sz = c.isNull(3) ? 0L : c.getLong(3);
                  out.add(new String[]{c.getString(0), c.getString(1), c.getString(2), String.valueOf(sz)});
                }
              } finally { if (c != null) c.close(); }
              return out;
            }

            private static boolean xfIsDir(String[] k) { return DocumentsContract.Document.MIME_TYPE_DIR.equals(k[2]); }

            private static void doExport(Uri tree) throws Exception {
              Context c = appCtx;
              ContentResolver cr = c.getContentResolver();
              String rootId = DocumentsContract.getTreeDocumentId(tree);
              Uri root = DocumentsContract.buildDocumentUriUsingTree(tree, rootId);
              String subId = null;
              for (String[] k : xfKids(cr, tree, rootId)) if (xfIsDir(k) && XF_FOLDER.equals(k[1])) { subId = k[0]; break; }
              Uri sub;
              if (subId == null) {
                sub = DocumentsContract.createDocument(cr, root, DocumentsContract.Document.MIME_TYPE_DIR, XF_FOLDER);
                if (sub == null) throw new IOException("could not create folder");
                subId = DocumentsContract.getDocumentId(sub);
              } else {
                sub = DocumentsContract.buildDocumentUriUsingTree(tree, subId);
              }
              JSONObject names = new JSONObject();
              try { names = new JSONObject(xPayload).optJSONObject("names"); if (names == null) names = new JSONObject(); } catch (Throwable ignored) { names = new JSONObject(); }
              List<String[]> have = xfKids(cr, tree, subId);
              File[] fs = dir(c).listFiles();
              List<File> todo = new ArrayList<>();
              List<String> todoName = new ArrayList<>();
              long total = 0;
              if (fs != null) {
                for (File f : fs) {
                  String n = f.getName();
                  if (!n.endsWith(".mp4") || f.length() <= 0) continue;
                  String id = n.substring(0, n.length() - 4);
                  String fr = names.optString(id, "");
                  String out = (fr.length() > 0 ? fr + " [" + id + "]" : id) + ".mp4";
                  boolean same = false;
                  for (String[] k : have) {
                    if (xfIsDir(k) || !id.equals(xfId(k[1]))) continue;
                    if (Long.parseLong(k[3]) == f.length()) same = true;
                    else { try { DocumentsContract.deleteDocument(cr, DocumentsContract.buildDocumentUriUsingTree(tree, k[0])); } catch (Throwable ignored) { } }
                  }
                  if (same) { xSkip++; continue; }
                  todo.add(f); todoName.add(out); total += f.length();
                }
              }
              xFiles = todo.size(); xTotal = total;
              byte[] buf = new byte[256 * 1024];
                            for (int i = 0; i < todo.size() && !xCancel; i++) {
                File f = todo.get(i);
                xCur = todoName.get(i);
                Uri dst = DocumentsContract.createDocument(cr, sub, "video/mp4", todoName.get(i));
                if (dst == null) { xBad++; continue; }
                boolean ok = false;
                InputStream in = null; OutputStream out = null;
                try {
                  in = new FileInputStream(f);
                  out = cr.openOutputStream(dst);
                  if (out == null) throw new IOException("cannot write");
                  int r;
                  while (!xCancel && (r = in.read(buf)) > 0) { out.write(buf, 0, r); xGot.addAndGet(r); }
                  out.flush();
                  ok = !xCancel;
                } catch (Throwable t) {
                  xBad++;
                } finally {
                  try { if (in != null) in.close(); } catch (Throwable ignored) { }
                  try { if (out != null) out.close(); } catch (Throwable ignored) { }
                  if (!ok) { try { DocumentsContract.deleteDocument(cr, dst); } catch (Throwable ignored) { } }
                }
                if (ok) xDone++;
              }
              if (xCancel) return;
              /* the list of what these files are (title, episode, ...), so the app can rebuild its Downloads list without the cloud */
              if (xPayload.length() > 0) {
                for (String[] k : xfKids(cr, tree, subId)) {
                  if (XF_MANIFEST.equals(k[1])) { try { DocumentsContract.deleteDocument(cr, DocumentsContract.buildDocumentUriUsingTree(tree, k[0])); } catch (Throwable ignored) { } }
                }
                Uri m = DocumentsContract.createDocument(cr, sub, "application/json", XF_MANIFEST);
                if (m != null) {
                  OutputStream mo = cr.openOutputStream(m);
                  try { if (mo != null) mo.write(xPayload.getBytes("UTF-8")); } finally { if (mo != null) mo.close(); }
                }
              }
            }

            /* import step 1: look into the folder and list what can be imported (nothing is copied yet) */
            private static void doScan(Uri tree) throws Exception {
              Context c = appCtx;
              ContentResolver cr = c.getContentResolver();
              String rootId = DocumentsContract.getTreeDocumentId(tree);
              String srcId = rootId;
              for (String[] k : xfKids(cr, tree, rootId)) if (xfIsDir(k) && XF_FOLDER.equals(k[1])) { srcId = k[0]; break; }
              List<String[]> items = new ArrayList<>();
              long total = 0;
              File d = dir(c);
              xManId = null;
              for (String[] k : xfKids(cr, tree, srcId)) {
                if (xfIsDir(k)) continue;
                if (XF_MANIFEST.equals(k[1])) {
                  xManId = k[0];
                  InputStream mi = cr.openInputStream(DocumentsContract.buildDocumentUriUsingTree(tree, k[0]));
                  try {
                    java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                    byte[] b = new byte[16384]; int r; long n = 0;
                    while (mi != null && (r = mi.read(b)) > 0 && n < 8L * 1024 * 1024) { bo.write(b, 0, r); n += r; }
                    xManifest = bo.toString("UTF-8");
                  } finally { if (mi != null) mi.close(); }
                  continue;
                }
                String id = xfId(k[1]);
                if (id == null || !k[1].endsWith(".mp4")) continue;
                long sz = Long.parseLong(k[3]);
                File ex = new File(d, safe(id) + ".mp4");
                if (ex.exists() && ex.length() == sz && sz > 0) { xSkip++; continue; }
                items.add(new String[]{k[0], k[1], safe(id), k[3]});
                total += sz;
              }
              xTree = tree; xItems = items;
              xFiles = items.size(); xTotal = total;
            }

            /* import step 2: copy the chosen videos into the app, then remove each from the folder (a move) */
            private static void doImportRun(List<String[]> sel) throws Exception {
              Context c = appCtx;
              ContentResolver cr = c.getContentResolver();
              Uri tree = xTree;
              File d = dir(c);
              byte[] buf = new byte[256 * 1024];
              for (int i = 0; i < sel.size() && !xCancel; i++) {
                String[] k = sel.get(i);
                xCur = k[1];
                File tmp = new File(d, k[2] + ".imp"), fin = new File(d, k[2] + ".mp4");
                boolean ok = false;
                InputStream in = null; FileOutputStream out = null;
                try {
                  in = cr.openInputStream(DocumentsContract.buildDocumentUriUsingTree(tree, k[0]));
                  if (in == null) throw new IOException("cannot read");
                  out = new FileOutputStream(tmp);
                  int r;
                  while (!xCancel && (r = in.read(buf)) > 0) { out.write(buf, 0, r); xGot.addAndGet(r); }
                  out.flush();
                  out.close(); out = null;
                  long want = Long.parseLong(k[3]);
                  if (!xCancel && tmp.length() > 0 && (want <= 0 || tmp.length() == want)) {
                    if (fin.exists()) fin.delete();
                    ok = tmp.renameTo(fin);
                  }
                } catch (Throwable t) {
                  ok = false;
                } finally {
                  try { if (in != null) in.close(); } catch (Throwable ignored) { }
