name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_PASS: ${{ secrets.KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make signing key (first run only)
        run: |
          if [ ! -f release.keystore.enc ]; then
            keytool -genkeypair -keystore release.keystore -alias animeshelf -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=AnimeShelf"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in release.keystore -out release.keystore.enc -pass env:KEY_PASS
            rm release.keystore
            git config user.name github-actions
            git config user.email actions@github.com
            git add release.keystore.enc
            git commit -m "Add signing key"
            git push
          fi
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html native.js manifest.webmanifest www/
          cp -r icons www/
          sed -i -E 's/env\(safe-area-inset-(top|bottom), *0(px)?\)/var(--sa-\1,0px)/g' www/index.html
          echo '<script src="native.js"></script>' >> www/index.html
      - run: npm install
      - run: npx cap add android
      - name: App icon (from your icons folder)
        run: |
          ls icons/*.png >/dev/null 2>&1 || { echo "no png icons found, keeping default"; exit 0; }
          IM=$(command -v magick || command -v convert)
          ICON=$(for f in icons/*.png; do echo "$($IM "$f" -format '%w' info:) $f"; done | sort -nr | head -1 | cut -d' ' -f2-)
          echo "Using icon: $ICON"
          RGB=$($IM "$ICON" -format '%[fx:int(255*p{3,3}.r+0.5)] %[fx:int(255*p{3,3}.g+0.5)] %[fx:int(255*p{3,3}.b+0.5)] %[fx:p{3,3}.a]' info:)
          set -- $RGB
          if [ "$(awk "BEGIN{print ($4<0.5)}")" = 1 ]; then BG="#0D0F19"; else BG=$(printf '#%02X%02X%02X' $1 $2 $3); fi
          echo "Icon background: $BG"
          RES=android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n l f <<< "$d"
            mkdir -p $RES/mipmap-$n
            $IM "$ICON" -resize ${l}x${l} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
            inner=$((f*75/100))
            $IM -size ${f}x${f} xc:none \( "$ICON" -resize ${inner}x${inner} \) -gravity center -composite $RES/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $RES/values $RES/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n <color name="ic_launcher_background">%s</color>\n</resources>\n' "$BG" > $RES/values/ic_launcher_background.xml
          for x in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n <background android:drawable="@color/ic_launcher_background"/>\n <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/$x.xml
          done
      - name: Native activity (edge-to-edge, real fullscreen + rotation)
        run: |
          PKG=$(node -p "require('./capacitor.config.json').appId")
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "package $PKG;" > "$MAIN"
          cat >> "$MAIN" <<'EOF'

          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
            private View customView;
            private WebChromeClient.CustomViewCallback customCb;
            private int saTop = 0, saBottom = 0;
            private OnBackPressedCallback fsBack;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              final Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = w.getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                w.setAttributes(lp);
              }
              WindowInsetsControllerCompat ic = WindowCompat.getInsetsController(w, w.getDecorView());
              ic.setAppearanceLightStatusBars(false);
              ic.setAppearanceLightNavigationBars(false);

              final WebView wv = getBridge().getWebView();
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public String get() { return saTop + "," + saBottom; }
              }, "AnimeInsets");

              ViewCompat.setOnApplyWindowInsetsListener(w.getDecorView(), (v, insets) -> {
                Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                float d = getResources().getDisplayMetrics().density;
                saTop = Math.round(b.top / d);
                saBottom = Math.round(b.bottom / d);
                final String js = "(function(){var s=document.documentElement.style;s.setProperty('--sa-top','" + saTop + "px');s.setProperty('--sa-bottom','" + saBottom + "px')})()";
                wv.post(() -> wv.evaluateJavascript(js, null));
                return ViewCompat.onApplyWindowInsets(v, insets);
              });

              fsBack = new OnBackPressedCallback(false) {
                @Override
                public void handleOnBackPressed() { exitCustom(); }
              };
              getOnBackPressedDispatcher().addCallback(this, fsBack);

              wv.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                @Override
                public void onShowCustomView(View view, WebChromeClient.CustomViewCallback cb) {
                  if (customView != null) { cb.onCustomViewHidden(); return; }
                  customView = view;
                  customCb = cb;
                  view.setBackgroundColor(Color.BLACK);
                  ((ViewGroup) getWindow().getDecorView()).addView(view,
                    new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                  fsBack.setEnabled(true);
                }

                @Override
                public void onHideCustomView() { exitCustom(); }
              });
            }

            private void exitCustom() {
              if (customView == null) return;
              View v = customView;
              WebChromeClient.CustomViewCallback cb = customCb;
              customView = null;
              customCb = null;
              fsBack.setEnabled(false);
              if (v.getParent() instanceof ViewGroup) ((ViewGroup) v.getParent()).removeView(v);
              WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView()).show(WindowInsetsCompat.Type.systemBars());
              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
              if (cb != null) cb.onCustomViewHidden();
            }
          }
          EOF
      - run: npx cap sync android
      - name: Build and sign
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in release.keystore.enc -out release.keystore -pass env:KEY_PASS
          cd android && ./gradlew assembleRelease && cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass env:KEY_PASS --ks-key-alias animeshelf --out AnimeShelf.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-apk
          path: AnimeShelf.apk
