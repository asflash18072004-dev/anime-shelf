name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_PASS: ${{ secrets.KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make signing key (first run only)
        run: |
          if [ ! -f release.keystore.enc ]; then
            keytool -genkeypair -keystore release.keystore -alias animeshelf -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AnimeShelf" -storepass:env KEY_PASS -keypass:env KEY_PASS
            openssl enc -aes-256-cbc -pbkdf2 -salt -in release.keystore -out release.keystore.enc -pass env:KEY_PASS
            rm release.keystore
            git config user.name github-actions
            git config user.email actions@github.com
            git add release.keystore.enc
            git commit -m "Add signing key"
            git push
          fi
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html native.js manifest.webmanifest www/
          cp -r icons www/
          sed -i -E 's/env\(safe-area-inset-(top|bottom), *0(px)?\)/var(--sa-\1,0px)/g' www/index.html
          echo '<script src="native.js"></script>' >> www/index.html
      - run: npm install
      - run: npx cap add android
      - name: App icon (from icon-192.png)
        continue-on-error: true
        run: |
          pip install pillow -q
          python3 - <<'PY'
          import os
          from PIL import Image
          best = 'icons/icon-192.png'
          if not os.path.exists(best):
              print('icon-192.png not found, keeping default')
              raise SystemExit(0)
          print('Using icon:', best)
          im = Image.open(best).convert('RGBA')
          px = im.getpixel((3, 3))
          bg = (13, 15, 25) if px[3] < 128 else px[:3]
          hexc = '#%02X%02X%02X' % bg
          print('Icon background:', hexc)
          res = 'android/app/src/main/res'
          dens = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for n, (l, f) in dens.items():
              d = res + '/mipmap-' + n
              os.makedirs(d, exist_ok=True)
              ic = im.resize((l, l), Image.LANCZOS)
              ic.save(d + '/ic_launcher.png')
              ic.save(d + '/ic_launcher_round.png')
              inner = int(f * 0.75)
              fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              fg.paste(im.resize((inner, inner), Image.LANCZOS), ((f - inner) // 2, (f - inner) // 2))
              fg.save(d + '/ic_launcher_foreground.png')
          os.makedirs(res + '/values', exist_ok=True)
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n <color name="ic_launcher_background">' + hexc + '</color>\n</resources>\n')
          adaptive = ('<?xml version="1.0" encoding="utf-8"?>\n'
                      '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                      ' <background android:drawable="@color/ic_launcher_background"/>\n'
                      ' <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
                      '</adaptive-icon>\n')
          for x in ('ic_launcher', 'ic_launcher_round'):
              open(res + '/mipmap-anydpi-v26/' + x + '.xml', 'w').write(adaptive)
          print('icon done')
          PY
      - name: Episode downloader (AnimeDL.java)
        run: |
          PKG=$(node -p "require('./capacitor.config.json').appId")
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          DIR=$(dirname "$MAIN")
          echo "package $PKG;" > "$DIR/AnimeDL.java"
          cat >> "$DIR/AnimeDL.java" <<'JEOF'

          import android.app.DownloadManager;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          public class AnimeDL {
            private static final String PREFS = "animedl";
            private static final String SUBDIR = "ShelfAnime";
            private final Context ctx;
            private final DownloadManager dm;

            public AnimeDL(Context c) {
              ctx = c.getApplicationContext();
              dm = (DownloadManager) ctx.getSystemService(Context.DOWNLOAD_SERVICE);
            }

            private static File dir(Context c) {
              File base = c.getExternalFilesDir(Environment.DIRECTORY_MOVIES);
              File d = new File(base, SUBDIR);
              if (!d.exists()) d.mkdirs();
              return d;
            }
            private static String safe(String id) { return id == null ? "" : id.replaceAll("[^A-Za-z0-9_\\-]", "_"); }
            private long dmId(String id) { return ctx.getSharedPreferences(PREFS, 0).getLong(safe(id), -1L); }
            private void putId(String id, long v) { ctx.getSharedPreferences(PREFS, 0).edit().putLong(safe(id), v).apply(); }
            private void dropId(String id) { ctx.getSharedPreferences(PREFS, 0).edit().remove(safe(id)).apply(); }

            @JavascriptInterface public boolean ok() { return true; }

            @JavascriptInterface
            public String start(String id, String url, String referer, String ua, String fileName) {
              try {
                cancel(id);
                File f = new File(dir(ctx), safe(id) + ".mp4");
                if (f.exists()) f.delete();
                DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                if (referer != null && referer.length() > 0) r.addRequestHeader("Referer", referer);
                if (ua != null && ua.length() > 0) r.addRequestHeader("User-Agent", ua);
                r.setTitle("Episode download");
                r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE);
                r.setAllowedOverMetered(true);
                r.setAllowedOverRoaming(true);
                r.setDestinationInExternalFilesDir(ctx, Environment.DIRECTORY_MOVIES, SUBDIR + "/" + safe(id) + ".mp4");
                putId(id, dm.enqueue(r));
                return "ok";
              } catch (Throwable t) {
                return "error: " + t;
              }
            }

            @JavascriptInterface
            public String status(String id) {
              long d = dmId(id);
              if (d < 0) return "{\"st\":\"none\",\"got\":0,\"total\":0}";
              Cursor c = null;
              try {
                c = dm.query(new DownloadManager.Query().setFilterById(d));
                if (c == null || !c.moveToFirst()) return "{\"st\":\"none\",\"got\":0,\"total\":0}";
                int st = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                long got = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                long total = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                String s;
                if (st == DownloadManager.STATUS_SUCCESSFUL) s = "ok";
                else if (st == DownloadManager.STATUS_FAILED) s = "fail";
                else s = "run";
                return "{\"st\":\"" + s + "\",\"got\":" + got + ",\"total\":" + total + "}";
              } catch (Throwable t) {
                return "{\"st\":\"none\",\"got\":0,\"total\":0}";
              } finally {
                if (c != null) c.close();
              }
            }

            @JavascriptInterface
            public void cancel(String id) {
              try {
                long d = dmId(id);
                if (d >= 0) dm.remove(d);
              } catch (Throwable ignored) { }
              dropId(id);
              try { File f = new File(dir(ctx), safe(id) + ".mp4"); if (f.exists()) f.delete(); } catch (Throwable ignored) { }
            }

            @JavascriptInterface
            public void remove(String id) { cancel(id); }

            public static WebResourceResponse serve(Context c, WebResourceRequest req) {
              try {
                Uri u = req.getUrl();
                String p = u.getPath();
                if (p == null || !p.startsWith("/__dl/")) return null;
                String name = safe(p.substring(6).replaceAll("\\.mp4$", ""));
                File f = new File(dir(c), name + ".mp4");
                Map<String, String> h = new HashMap<>();
                h.put("Access-Control-Allow-Origin", "*");
                h.put("Accept-Ranges", "bytes");
                if (!f.exists()) return new WebResourceResponse("text/plain", "utf-8", 404, "Not Found", h, new java.io.ByteArrayInputStream(new byte[0]));
                long len = f.length();
                long start = 0, end = len - 1;
                String range = req.getRequestHeaders().get("Range");
                if (range == null) range = req.getRequestHeaders().get("range");
                boolean partial = false;
                if (range != null && range.startsWith("bytes=")) {
                  String[] a = range.substring(6).split("-", 2);
                  try {
                    if (a[0].length() > 0) start = Long.parseLong(a[0]);
                    if (a.length > 1 && a[1].length() > 0) end = Long.parseLong(a[1]);
                  } catch (NumberFormatException ignored) { }
                  if (end >= len) end = len - 1;
                  if (start > end) start = 0;
                  partial = true;
                }
                long n = end - start + 1;
                FileInputStream fis = new FileInputStream(f);
                long skipped = 0;
                while (skipped < start) { long s = fis.skip(start - skipped); if (s <= 0) break; skipped += s; }
                InputStream in = new LimitedStream(fis, n);
                h.put("Content-Length", String.valueOf(n));
                if (partial) {
                  h.put("Content-Range", "bytes " + start + "-" + end + "/" + len);
                  return new WebResourceResponse("video/mp4", null, 206, "Partial Content", h, in);
                }
                return new WebResourceResponse("video/mp4", null, 200, "OK", h, in);
              } catch (Throwable t) {
                return null;
              }
            }

            private static class LimitedStream extends InputStream {
              private final InputStream in;
              private long left;
              LimitedStream(InputStream in, long n) { this.in = in; this.left = n; }
              @Override public int read() throws IOException { if (left <= 0) return -1; int b = in.read(); if (b >= 0) left--; return b; }
              @Override public int read(byte[] b, int o, int l) throws IOException {
                if (left <= 0) return -1;
                int r = in.read(b, o, (int) Math.min(l, left));
                if (r > 0) left -= r;
                return r;
              }
              @Override public void close() throws IOException { in.close(); }
            }
          }
          JEOF
      - name: Native activity (edge-to-edge, real fullscreen + rotation)
        run: |
          PKG=$(node -p "require('./capacitor.config.json').appId")
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "package $PKG;" > "$MAIN"
          cat >> "$MAIN" <<'EOF'

          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          import com.getcapacitor.BridgeWebViewClient;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends BridgeActivity {
            private View customView;
            private WebChromeClient.CustomViewCallback customCb;
            private int saTop = 0, saBottom = 0;
            private OnBackPressedCallback fsBack;

            private WebResourceResponse agOpen(String target, String ref, String ua, String range) {
              try {
                if (target == null || !(target.startsWith("https://") || target.startsWith("http://"))) return null;
                HttpURLConnection c = (HttpURLConnection) new URL(target).openConnection();
                c.setConnectTimeout(8000);
                c.setReadTimeout(25000);
                c.setInstanceFollowRedirects(true);
                c.setRequestProperty("User-Agent", (ua != null && ua.length() > 0) ? ua : "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");
                if (ref != null && ref.length() > 0) c.setRequestProperty("Referer", ref);
                if (range != null && range.length() > 0) c.setRequestProperty("Range", range);
                c.setRequestProperty("Accept", "*/*");
                c.setRequestProperty("Accept-Encoding", "identity");
                int code = c.getResponseCode();
                if (code != 200 && code != 206) { c.disconnect(); return null; }
                String ct = c.getContentType();
                String mime = "video/mp4";
                if (ct != null) { String m = ct.split(";")[0].trim(); if (m.startsWith("video/")) mime = m; }
                Map<String, String> h = new HashMap<>();
                String cl = c.getHeaderField("Content-Length");
                if (cl != null) h.put("Content-Length", cl);
                String cr = c.getHeaderField("Content-Range");
                if (cr != null) h.put("Content-Range", cr);
                h.put("Accept-Ranges", "bytes");
                h.put("Access-Control-Allow-Origin", "*");
                return new WebResourceResponse(mime, null, code, code == 206 ? "Partial Content" : "OK", h, c.getInputStream());
              } catch (Exception e) {
                return null;
              }
            }

            private WebResourceResponse agProxy(WebResourceRequest rq) {
              Uri u = rq.getUrl();
              String range = null;
              Map<String, String> rh = rq.getRequestHeaders();
              if (rh != null) for (Map.Entry<String, String> e : rh.entrySet()) if ("range".equalsIgnoreCase(e.getKey())) range = e.getValue();
              WebResourceResponse r = agOpen(u.getQueryParameter("u"), u.getQueryParameter("r"), u.getQueryParameter("ua"), range);
              if (r == null) r = agOpen(u.getQueryParameter("fb"), null, null, range);
              if (r == null) return new WebResourceResponse("text/plain", "utf-8", 502, "Bad Gateway", new HashMap<String, String>(), new java.io.ByteArrayInputStream(new byte[0]));
              return r;
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              final Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = w.getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                w.setAttributes(lp);
              }
              WindowInsetsControllerCompat ic = WindowCompat.getInsetsController(w, w.getDecorView());
              ic.setAppearanceLightStatusBars(false);
              ic.setAppearanceLightNavigationBars(false);

              final WebView wv = getBridge().getWebView();
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public String get() { return saTop + "," + saBottom; }
              }, "AnimeInsets");

              getBridge().setWebViewClient(new BridgeWebViewClient(getBridge()) {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  try {
                    Uri u = request.getUrl();
                    if ("localhost".equals(u.getHost()) && "/__ag".equals(u.getPath())) return agProxy(request);
                    if ("localhost".equals(u.getHost()) && u.getPath() != null && u.getPath().startsWith("/__dl/")) {
                      WebResourceResponse dl = AnimeDL.serve(MainActivity.this, request);
                      if (dl != null) return dl;
                    }
                  } catch (Exception e) { }
                  return super.shouldInterceptRequest(view, request);
                }
              });
              wv.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public boolean ok() { return true; }
              }, "AnimeProxy");
              wv.addJavascriptInterface(new AnimeDL(this), "AnimeDL");

              ViewCompat.setOnApplyWindowInsetsListener(w.getDecorView(), (v, insets) -> {
                Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                float d = getResources().getDisplayMetrics().density;
                saTop = Math.round(b.top / d);
                saBottom = Math.round(b.bottom / d);
                final String js = "(function(){var s=document.documentElement.style;s.setProperty('--sa-top','" + saTop + "px');s.setProperty('--sa-bottom','" + saBottom + "px')})()";
                wv.post(() -> wv.evaluateJavascript(js, null));
                return ViewCompat.onApplyWindowInsets(v, insets);
              });

              fsBack = new OnBackPressedCallback(false) {
                @Override
                public void handleOnBackPressed() { exitCustom(); }
              };
              getOnBackPressedDispatcher().addCallback(this, fsBack);

              wv.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                @Override
                public void onShowCustomView(View view, WebChromeClient.CustomViewCallback cb) {
                  if (customView != null) { cb.onCustomViewHidden(); return; }
                  customView = view;
                  customCb = cb;
                  view.setBackgroundColor(Color.BLACK);
                  ((ViewGroup) getWindow().ge
