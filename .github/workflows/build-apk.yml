name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_PASS: ${{ secrets.KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make signing key (first run only)
        run: |
          if [ ! -f release.keystore.enc ]; then
            keytool -genkeypair -keystore release.keystore -alias animeshelf -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=AnimeShelf"
            openssl enc -aes-256-cbc -pbkdf2 -salt -in release.keystore -out release.keystore.enc -pass env:KEY_PASS
            rm release.keystore
            git config user.name github-actions
            git config user.email actions@github.com
            git add release.keystore.enc
            git commit -m "Add signing key"
            git push
          fi
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html native.js manifest.webmanifest www/
          cp -r icons www/
          echo '<script src="native.js"></script>' >> www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build and sign
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in release.keystore.enc -out release.keystore -pass env:KEY_PASS
          cd android && ./gradlew assembleRelease && cd ..
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-pass env:KEY_PASS --ks-key-alias animeshelf --out AnimeShelf.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-apk
          path: AnimeShelf.apk
