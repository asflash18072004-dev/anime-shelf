<style>
:root{color-scheme:dark;--bg:#121522;--card:#1c2033;--ink:#eef0f8;--mute:#8d93ad;--ac:#ff6b8b;--gold:#ffd36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:0 0 80px}
h1,h2{font-family:Georgia,serif;margin:0}
header{padding:16px 14px 6px}header h1{font-size:26px}
main{padding:0 14px}
h2{font-size:19px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2a2f48}
.card p{margin:0;padding:6px 7px 8px;font-size:12.5px;line-height:1.25;height:3.1em;overflow:hidden}
.badge{position:absolute;top:5px;left:5px;display:flex;gap:3px;font-size:12px}
.badge span{background:#000a;border-radius:6px;padding:1px 5px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d0f19;border-top:1px solid #2a2f48;padding-bottom:env(safe-area-inset-bottom,0)}
nav .ns{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav .ns::-webkit-scrollbar{display:none}
nav .fd{position:absolute;top:0;bottom:env(safe-area-inset-bottom,0);width:30px;z-index:1;pointer-events:none;opacity:0;transition:opacity .2s}
nav .fdl{left:0;background:linear-gradient(90deg,#0d0f19,#0d0f1900)}nav .fdr{right:0;background:linear-gradient(270deg,#0d0f19,#0d0f1900)}nav .fd.show{opacity:1}
nav button{flex:0 0 calc(100% / 5.4);background:none;border:0;color:var(--mute);padding:9px 0 8px;font-size:11px;white-space:nowrap}
.epi{width:54px;padding:8px 4px;text-align:center;border-radius:10px;border:1px solid #2a2f48;background:var(--bg);color:var(--ink);font:600 16px system-ui,sans-serif;-moz-appearance:textfield}
.epi::-webkit-outer-spin-button,.epi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pb{height:6px;border-radius:99px;background:#2a2f48;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);border-radius:99px}
.gh{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin:16px 0 8px;cursor:pointer}
.gh img,.gh .noimg{width:40px;height:56px;object-fit:cover;border-radius:6px;flex:none}.gh small{color:var(--mute);display:block}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--ac)}
input[type=search],input[type=text].pw,input[type=password].pw,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);font-size:15px}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;background:var(--card);color:var(--mute);border:0;font-size:13px}
.chip.on{background:var(--ac);color:#1a0a10;font-weight:600}
.btn{padding:11px 14px;border-radius:10px;border:0;background:var(--ac);color:#1a0a10;font-weight:600;font-size:14px}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{color:var(--mute);padding:20px 0;text-align:center}
.rank{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:8px;cursor:pointer}
.rank img{width:46px;height:64px;object-fit:cover;border-radius:6px}
.rank .n{width:26px;text-align:center;font:700 18px Georgia,serif;color:var(--gold)}
.rank .t{flex:1;min-width:0}.rank .t small{color:var(--mute);display:block}
.rank .s{font:700 18px Georgia,serif;color:var(--gold)}
#ov{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:9;padding-bottom:40px}
#ov .top,#pf .top{position:sticky;top:0;background:#121522;padding:10px 14px;z-index:2}
.hero{display:flex;gap:12px;padding:0 14px}
.hero img{width:110px;border-radius:10px;align-self:flex-start}
.hero h2{margin:0 0 6px;font-size:20px}.hero small{color:var(--mute)}
.panel{background:var(--card);border-radius:12px;margin:14px;padding:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:0;background:#2a2f48;color:var(--ink);font-size:20px}
.tog{display:flex;gap:8px}.tog button{flex:1;padding:11px;border-radius:10px;border:1px solid #2a2f48;background:none;color:var(--ink);font-size:14px}
.tog button.on{background:var(--ac);border-color:var(--ac);color:#1a0a10;font-weight:600}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;padding:0 14px}
.ch{background:var(--card);border-radius:10px;padding:6px;text-align:center;font-size:12px;position:relative}
.ch img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#2a2f48}
.ch .fv{position:absolute;top:8px;right:8px;background:#000a;border:0;border-radius:50%;width:28px;height:28px;color:#fff;font-size:15px}
.ch .fv.on{color:var(--ac)}
.ch select{padding:4px;font-size:12px;margin-top:4px}
.rtw{margin:10px 0}.rtn{display:flex;align-items:baseline;gap:4px;font:700 24px Georgia,serif;color:var(--gold)}.rtn small{font:13px system-ui;color:var(--mute)}
.clr{margin-left:auto;background:#2a2f48;border:0;color:var(--ink);border-radius:8px;padding:4px 10px;font-size:12px}
.rt{display:flex}.rt button{flex:1;background:none;border:0;padding:5px 0;line-height:1;color:#4a5072;font-size:26px}
.rt.top button.on{color:var(--gold)}.rt.bot button{font-size:21px}.rt.bot button.on{color:var(--ac)}
.hint{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols>div{min-width:0}.cols h2{font-size:16px;margin:12px 0 8px}
.mini{display:flex;gap:7px;background:var(--card);border-radius:10px;padding:6px;margin-bottom:7px;cursor:pointer}
.mini img{width:42px;height:60px;object-fit:cover;border-radius:6px;flex:none;background:#2a2f48}
.mini div{min-width:0;font-size:12.5px;line-height:1.25}.mini b{font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini small{display:block;color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{cursor:pointer}.ch .rl{display:block;color:var(--gold);margin-top:3px}
#sh{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;justify-content:flex-end}
.shb{flex:1;background:#000a}.shp{background:var(--card);padding:14px;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;gap:10px;align-items:center;margin-bottom:6px}.shh img{width:52px;height:72px;object-fit:cover;border-radius:8px}
.shh div{flex:1;min-width:0}.shh small{display:block;color:var(--mute)}
.fvb{background:none;border:0;font-size:30px;color:var(--mute)}.fvb.on{color:var(--ac)}
.noimg{background:#2a2f48;border-radius:8px}.card .noimg{aspect-ratio:2/3;border-radius:0}.mini .noimg{width:42px;height:60px;flex:none}.rank .noimg{width:46px;height:64px;flex:none}.shh .noimg{width:52px;height:72px;flex:none}.ch .noimg{aspect-ratio:1}
.cnote{padding:0 14px 10px;color:var(--mute);font-size:12.5px}.cerr{margin-top:6px;color:#ff9db0}
.grp{margin-bottom:6px}
.sec{position:sticky;top:58px;z-index:1;background:var(--bg);padding:8px 14px;font-size:13px;border-bottom:1px solid #2a2f48;margin-bottom:10px}
.sec b{color:var(--ac);margin-right:6px}.sec small{color:var(--mute);margin-left:6px}
header{padding:8px 14px 6px}
.madeby{flex:1;text-align:center;font-family:"Dancing Script","Segoe Script","Snell Roundhand","Brush Script MT","Apple Chancery",cursive;font-style:italic;font-size:22px;line-height:1.15;color:#e8a46a;padding:0 6px;margin-right:28px}
.hd{display:flex;align-items:center;justify-content:space-between}.logo{height:64px;width:auto;display:block}
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink);max-width:96px;font-size:12px;padding:4px}
.prof span{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av,.avl{border-radius:50%;object-fit:cover;border:2px solid var(--ac);background:#2a2f48}.av{width:54px;height:54px}.avl{width:96px;height:96px;border-width:3px}
.av.ph,.avl.ph{display:flex;align-items:center;justify-content:center;font:700 24px Georgia,serif;color:var(--ac)}
#pf{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:10;padding-bottom:40px}
.pfh{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 14px}
.pni{width:80%;text-align:center;padding:11px;border-radius:10px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);font-size:17px}
.avg{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin-top:8px}
.avg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;cursor:pointer;background:#2a2f48}
.pl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pchip{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink);width:74px;font-size:12px;padding:2px}
.pchip .av{width:58px;height:58px}.pchip.on .av{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pchip span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus{width:58px;height:58px;border-radius:50%;border:2px dashed var(--mute);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mute)}
details summary{color:var(--mute);font-size:13px;cursor:pointer}
/* WATCH SYSTEM */
#wt{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0)}
#wt .wtop{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 14px;display:flex;gap:8px;align-items:center}
.pl{position:relative;background:#000;aspect-ratio:16/9;width:100%;max-height:75vh;overflow:hidden;user-select:none;touch-action:manipulation}
.pl video,.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pl .st{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;color:#fff;background:#000c;z-index:5;font-size:14px}
.pl.loading .st,.pl.err .st{display:flex}
.pl.loading .st{align-items:flex-end;padding-bottom:14px;background:#000;font-size:13px;opacity:.8}
.pl.loading::after{content:'';position:absolute;left:50%;top:46%;width:64px;height:64px;margin:-32px 0 0 -32px;border:6px solid #ffffff33;border-top-color:#fff;border-radius:50%;z-index:8;animation:plspin .8s linear infinite;pointer-events:none}
@keyframes plspin{to{transform:rotate(360deg)}}
.pl .gl{position:absolute;inset:0;z-index:4;background:transparent}
/* The control bar the JS creates is .pl__controls > .pl__seek + .row2. The stylesheet only styled
   .ctl/.seek/.row2 (bare), so the bar existed in the DOM but was INVISIBLE and UNCLICKABLE.
   Every class below is one the player actually creates (see PB._buildControls). */
.pl .pl__controls{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:6px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:12px;opacity:0;transition:opacity .18s ease;pointer-events:none}
.pl.ui .pl__controls{opacity:1;pointer-events:auto}
.pl .pl__seek{position:relative;height:6px;background:#ffffff33;border-radius:3px;margin:2px 0 8px;cursor:pointer;touch-action:none}
.pl .pl__seek::after{content:'';position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.pl .pl__seek .buf,.pl .pl__seek .pos{position:absolute;top:0;left:0;bottom:0;border-radius:3px;pointer-events:none}
.pl .pl__seek .buf{background:#ffffff66}.pl .pl__seek .pos{background:var(--ac)}
.pl .pl__controls .row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl .pl__controls .tm{font-variant-numeric:tabular-nums;opacity:.85;margin-left:auto;margin-right:auto}
.pl .pl__controls .b{background:#0009;border:0;color:#fff;min-width:36px;height:32px;border-radius:6px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.pl .pl__controls .b:hover{background:#000c}.pl .pl__controls .b.on{background:var(--ac);color:#1a0a10}
.pl .pl__controls select.b{width:auto;padding:0 6px;font-size:12px;min-width:54px}
.pl .pl__controls .vo{accent-color:var(--ac);width:64px;max-width:30vw}
/* CENTER PLAY/PAUSE OVERLAY (added). It is shown/hidden by the SAME .pl.ui class as the control
   bar, so it follows the one 3s hide timer. The wrapper never blocks the video (pointer-events:none)
   and the button itself is only interactive while .ui is set — so it cannot permanently block taps. */
.pl .pl__center{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .18s ease}
.pl.ui .pl__center{opacity:1}
.pl .pl__center button{pointer-events:none;width:76px;height:76px;border-radius:50%;border:0;background:#000000a8;color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 14px #0007;transition:background .15s ease,transform .15s ease}
.pl.ui .pl__center button{pointer-events:auto}
.pl .pl__center button:hover{background:#000000cc}
.pl .pl__center button:active{transform:scale(.94)}
.pl.locked .pl__center,.pl.ended .pl__center{display:none}
@media(max-width:520px){.pl .pl__center button{width:64px;height:64px;font-size:26px}}
.pl .pl__tip{position:absolute;top:42%;background:#000d;color:#fff;padding:8px 14px;border-radius:99px;z-index:7;display:none;font-weight:700;font-size:14px;pointer-events:none;opacity:.95}
.pl__tip.l{left:8%}.pl__tip.r{right:8%}.pl__tip.center{left:50%;transform:translateX(-50%)}
.pl.locked .pl__controls,.pl.ended .pl__controls{display:none}
.pl__nx{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000000cc;color:#fff}
.pl.ended .pl__nx{display:flex}
.pl__tip.l{left:8%}.pl__tip.r{right:8%}.pl__tip.center{left:50%;transform:translateX(-50%)}
.wsec{padding:0 14px}.wsec h3{margin:14px 0 6px;font-size:13px;color:var(--mute);letter-spacing:.05em}
.vb{display:flex;gap:8px;flex-wrap:wrap}
.vb button{flex:1 1 180px;min-height:46px;border-radius:10px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);text-align:left;padding:8px 12px}
.vb button.on{border-color:var(--ac);background:#ff6b8b22}.vb button:disabled{opacity:.45}
.vb small{display:block;color:var(--mute)}
.vb button .dot{float:left;margin-right:6px;color:var(--ac)}
.vb button.req{border-style:dashed;opacity:.85}
.vb button .tagn{color:var(--ac);font-size:11px}
.pf{padding:2px 14px 6px;font-size:13px;color:var(--ink)}
.pf .hint{color:var(--mute)}
.rq{padding:0 14px 6px;font-size:12px;color:var(--gold)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-height:220px;overflow:auto}
.eg button{min-height:40px;border-radius:8px;border:1px solid #2a2f48;background:var(--card);color:var(--ink)}.eg button.on{background:var(--ac);color:#1a0a10}
#wmsg{padding:8px 14px;color:var(--gold);font-size:13px;min-height:20px}
.eg button.ed{background:#1e3a8a;border-color:#1e3a8a;color:#fff}.eg button.ec{background:#86efac;border-color:#86efac;color:#052e16}.eg button.ex{background:#dc2626;border-color:#dc2626;color:#fff}.eg button.sel{outline:2px solid #fff;outline-offset:1px}
.lg{font-size:12px;color:var(--mute);margin:6px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle}
.xb{background:#000b;color:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:14px;flex:none;cursor:pointer}
.card .xb{position:absolute;top:6px;right:6px;z-index:2}.rank .xb,.gh .xb{margin-left:auto}
</style></head><body>

/* DATA RULES, enforced in code below (see track()):

const KEY0='animeShelfV1';
let profiles=[],curP='main';

/* The built-in Guest profile (id 'main'): always exists, always named Guest, never removed, no password. A fresh browser opens on it. */
const GUEST='main';
function fixGuest(a){let g=a.find(p=>p.id==GUEST);if(!g){g={id:GUEST,avatar:'',file:'data.json',c:0,t:0};a.push(g)}
 g.name='Guest';g.hidden=false;delete g.pw;return a}
fixGuest(profiles);
try{curP=localStorage.getItem('animeShelfCurP')||'main'}catch(e){}
if(!profiles.some(p=>p.id==curP&&!p.hidden))curP=(profiles.find(p=>!p.hidden)||profiles[0]).id;
const keyFor=id=>id=='main'?KEY0:KEY0+':'+id;
let KEY=keyFor(curP);
let db={anime:{},chars:{}},tab='home',rk={kind:'anime',sort:'high'},cur=null,curChars=[];
try{db=Object.assign(db,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}

  if(v===undefined)blocked('Blocked: saving undefined would erase data. Use null or a flag like fav:false.');
  if(v&&v[RAW])v=v[RAW];
  t[k]=v;
  if(depth==1&&v&&typeof v=='object'&&!Array.isArray(v)&&k!=='t')v.t=Date.now();
  else if(depth>=2&&entry&&k!=='t')entry.t=Date.now();

 deleteProperty(t,k){

  /* o.ms limits only the wait for the server to START answering; once it answers, the body gets its own 3s to download. */
  const ac=new AbortController();let t=setTimeout(()=>ac.abort(),o.ms||2000);
  try{const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body,signal:ac.signal});
   clearTimeout(t);t=setTimeout(()=>ac.abort(),3000);
   let j=null;try{j=await r.json()}catch(e){}
   if(j&&j.data){_gqlCache.set(ck,j.data);return j.data}
   throw r.status||1}

  const left=end-Date.now();if(left<400)break;

  try{const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body,signal:ac.signal});
   clearTimeout(t);
   if(r.status===429){last=429;await _wait(Math.min(parseInt(r.headers.get('Retry-After'))||1,1.2)*1000);continue}
   let j=null;try{j=await r.json()}catch(e){}
   if(j&&j.data){_gqlCache.set(ck,j.data);return j.data}
   last=r.status||1;

  setRate(r){try{if(this.el)this.el.playbackRate=+r}catch(e){}},
  setSub(i){if(!this.el)return;const ts=[].slice.call(this.el.textTracks||[]);
   ts.forEach((t,idx)=>{t.mode=(idx===+i)?'showing':'disabled'});
   PB._refreshCC()},
  seek(x){if(!this.el)return;this.el.currentTime=x*this.duration;PB._updateSeek()},
  toggleFs(){try{
   const pl=document.getElementById('pl');
   if(document.fullscreenElement)document.exitFullscreen();
   else if((pl&&pl.requestFullscreen)||(this.el&&this.el.requestFullscreen)){((pl||this.el)).requestFullscreen();
  }}catch(e){}},
  detach(){this.el=null}
 };
 return this.video;
};

PB._refreshCC=function(){
 const pl=document.getElementById('pl');if(!pl)return;
 const ts=[];try{const v=PB.video&&PB.video.el;if(v)v.textTracks&&ts.push(...v.textTracks)}catch(e){}
 const ccBtn=pl.querySelector('.js-cc');if(ccBtn){ccBtn.classList.toggle('on',ts.some(t=>t.mode==='showing'))}
 const sel=pl.querySelector('.js-subsel');if(sel){sel.innerHTML=ts.map((t,i)=>`<option value="${i}" ${t.mode==='showing'?'selected':''}>${esc(t.label||t.language||('Track '+(i+1)))}</option>`).join('')}
};
PB._updateSeek=function(){
 const pl=document.getElementById('pl');if(!pl||!PB.video)return;
 const dur=PB.video.duration||0,cur=PB.video.currentTime||0;
 const seek=pl.querySelector('.pl__seek');if(!seek)return;
 seek.querySelector('.pos').style.width=(dur?(cur/dur*100):0)+'%';
 const tm=pl.querySelector('.tm');if(tm)tm.textContent=PB._fmtT(cur)+' / '+PB._fmtT(dur);
 const buf=seek.querySelector('.buf');
 if(PB.video.el&&PB.video.el.buffered&&PB.video.el.buffered.length){
  try{const e=PB.video.el.buffered.end(PB.video.el.buffered.length-1);
   buf.style.width=(dur?(e/dur*100):0)+'%';
  }catch(x){}}
};
PB._fmtT=function(t){t=Math.max(0,t|0);const h=t/3600|0,m=(t%3600)/60|0,s=t%60;return(h?(h+':')+String(m).padStart(2,'0'):m+':')+String(s).padStart(2,'0')};
PB._tip=function(cls,txt){const pl=document.getElementById('pl');if(!pl)return;
 const e=pl.querySelector('.pl__tip.'+cls);if(!e)return;
 e.textContent=txt;e.style.display='block';
 clearTimeout(e._tt);e._tt=setTimeout(()=>e.style.display='none',500);
 PB._addTimer(e._tt);
};

/* ====== BUILD vs IFRAME vs VIDEO ======
   After every await, the element the source is attached to MUST be the element that is on
   screen. PB.cleanupElement() wipes #pl's children but never the container itself. */
PB.bootstrap=function(){let pl=document.getElementById('pl');if(!pl){wdraw();pl=document.getElementById('pl')}return pl};

PB.startSource=async function(s,v,gen,sess){
 const alive=()=>gen===PB._gen&&!!(sess&&sess.check());
 const chk=()=>{if(!alive()){const e=new Error('cancelled');e.__sess=1;throw e}};
 const myGen=++PB._gen;PB._gen=myGen;

 const kind=classifySource(s);
 W.pb=null;W.video=null; // W bridges the legacy list/UI

 if(kind===SOURCE_KIND.PROVIDER_PLAYER){
  chk();
  PB.cleanupElement();
  PB._gen=myGen;
  const pl=document.getElementById('pl');if(!pl)throw layerErr(LAYER.RENDER,'player container missing',{code:'nopl'});
  pl.classList.add('loading');plState('loading','Loading the provider player…');
  /* ---- ANIKOTO: the returned player url is VERIFIED BEFORE IT IS FRAMED. --------------------
     "An iframe was created" and "the iframe fired load" are NOT playback: a provider error
     document is an HTML page too, so it loads perfectly and shows no video. For an AniKoto source
     every candidate url is read first (an ordinary CORS read of the provider's own response — its
     host sends access-control-allow-origin: *). The candidate that answers with the provider's
     player page is framed; a candidate that answers with the file-not-found document is rejected
     and the next candidate / next AniKoto server is used. Nothing here changes how any other
     provider's embed, or any direct media / HLS source, is handled. ----------------------------- */
  const ako=!!(s&&s._ako);
  let useUrl=String((s&&s.url)||''),probe=null,verified=false;
  if(ako){
   const cands=akoEmbedCandidates(s);let chosen=null,cp=null;
   for(const cu of cands){
    if(!alive())throw Object.assign(new Error('cancelled'),{__sess:1});
    const pr=await akoProbeEmbed(cu,sess?sess.sig:null,ST_BUDGET.akoProbe);
    akoAdd({phase:'probe',server:String(s._akoServer||''),url:cu,type:akoUrlKind(cu),
     status:pr.status,bytes:pr.bytes,kind:pr.kind,ok:(pr.ok===true?true:(pr.ok==='error-page'?false:null))});
    if(pr.ok===true){chosen=cu;cp=pr;break}
    if(pr.ok!=='error-page'&&!chosen){chosen=cu;cp=pr}
   }
   chk();
   if(!chosen){
    akoAdd({phase:'abandon',server:String(s._akoServer||''),url:String(s.url||''),ok:false,
     reason:'every candidate url answered with the provider file-not-found document — this source is dead for this episode',
     fallback:'next AniKoto server'});
    PB.cleanupElement();PB._gen=myGen;
    throw layerErr(LAYER.VIDEO,'the provider answered with its file-not-found document ('+akoUrlKind(s.url)+') — source not framed',{code:'embed-dead'})
   }
   useUrl=chosen;probe=cp;verified=!!(cp&&cp.ok===true);
   akoAdd({phase:'select',server:String(s._akoServer||''),url:useUrl,type:akoUrlKind(useUrl),ok:verified,
    reason:verified?('player page verified before framing (HTTP '+cp.status+', '+cp.bytes+'B)'):('probe inconclusive'+(cp&&cp.kind?(' — '+cp.kind):'')+' — framed unverified')});
  }
  const f=document.createElement('iframe');
  f.allow='fullscreen; picture-in-picture; autoplay';f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';
  f.src=useUrl;pl.appendChild(f);
  PB.ifr=f;W.video=f;   /* W.video: the SAME element that received the source (decision panel) */
  if(ako)akoAdd({phase:'iframe',server:String(s._akoServer||''),url:useUrl,ok:true,
   reason:'iframe element created and appended to #pl — creation is NOT playback'});
  /* A provider frame is cross-origin, so its own <video> is unreadable from this page (an
     X-Frame-Options / CSP block does not even fire `error`). The ONE deeper signal a provider can
     offer is its own postMessage announcement: when it arrives it is recorded as an OBSERVED
     playback signal. Silence is never reported as playback. */
  let playSig=false,playWhy='';
  try{PB._addListener(window,'message',function(ev){try{
   if(!alive()||playSig)return;
   if(useUrl.indexOf(String(ev.origin||''))!==0)return;
   const d=String((ev.data&&(ev.data.event||ev.data.type||ev.data.state))||ev.data||'');
   if(!/play|timeupdate|loaded|canplay|ready/i.test(d))return;
   playSig=true;playWhy='provider frame announced "'+d.slice(0,44)+'"';
   akoAdd({phase:'playback',server:String(s._akoServer||''),url:useUrl,ok:true,reason:playWhy});
  }catch(e){}})}catch(e){}
  PB._addListener(f,'load',(e)=>{chk();
   try{attAdd({stage:'media',trace:{prov:v.provider,type:'iframe',url:useUrl,host:hostOfUrl(useUrl),
    kind:ako?('player-page'+(verified?' (verified)':' (unverified)')):'player-page',
    hdrRef:hdrGet(s.headers,'referer'),ev:['frame load'],err:null,ok:true,
    delivered:ako?'probed provider player page':'direct iframe'}})}catch(x){}
   pl.classList.remove('loading','err');pl.classList.add('active');
   if(ako)akoAdd({phase:'frame',server:String(s._akoServer||''),url:useUrl,ok:true,
    reason:'frame load event received — LOAD is not playback; the provider player starts its own video'});
   plState('active',ako?(verified?'Provider player verified and loaded — press ▶ in the player if it does not start by itself.':'Provider player attached (unverified) — press ▶ in the player.'):'');
   W.pb={originalUrl:s.url,playbackUrl:useUrl,playbackMode:'embed',needs:[],provider:v.provider,type:'iframe',host:hostOfUrl(useUrl),verified:verified};
   if(alive()){noteSourceOk(v.provider,W.lang);commitActivePlayback(activeArgs(Object.assign({},s,{url:useUrl}),v,'embed'))}
   const pl2=document.getElementById('pl');if(pl2)pl2.classList.remove('ended');
   /* tapping provider iframes shows nothing additional — provider UI handles interaction. */
  });
  /* no embed load within budget → the frame was refused or never answered */
  const grid=setTimeout(()=>{try{chk();
   if(!pl.classList.contains('active')){
    try{attAdd({stage:'media',trace:{prov:v.provider,type:'iframe',url:useUrl,host:hostOfUrl(useUrl),kind:'player-page',
     err:null,ok:false,delivered:'no frame load event'}})}catch(x){}
    if(ako)akoAdd({phase:'timeout',server:String(s._akoServer||''),url:useUrl,ok:false,
     reason:'no frame load event within '+ST_BUDGET.embedLoad+'ms (possible X-Frame-Options / CSP frame-ancestors refusal)',
     fallback:'next AniKoto server'});
    /* no throw here: a throw inside setTimeout is UNCAUGHT and only poisons the console — the
       awaited promise below already rejects with the same frameblocked condition */
   }}catch(e){}/* cancelled by a newer attempt */
  },ST_BUDGET.embedLoad);
  PB._addTimer(grid);
  try{await new Promise((ok,bad)=>{let done=false;
   const fin=er=>{if(done)return;done=true;clearTimeout(grid);er?bad(er):ok()};
   f.addEventListener('load',()=>fin(),{once:true});
   f.addEventListener('error',()=>{if(ako)akoAdd({phase:'frame',server:String(s._akoServer||''),url:useUrl,ok:false,
    reason:'frame error event',fallback:'next AniKoto server'});
    fin(Object.assign(new Error('frame error'),{code:'frameblocked'}))},{once:true});
   PB._addTimer(setTimeout(()=>{if(!pl.classList.contains('active'))fin(Object.assign(new Error('frame load timeout'),{code:'frameblocked'}))},ST_BUDGET.embedLoad));
  });}catch(e){if(ako)akoAdd({phase:'frame',server:String(s._akoServer||''),url:useUrl,ok:false,reason:String((e&&e.message)||e),fallback:'next AniKoto server'});
   PB.cleanupElement();PB._gen=myGen;throw e}
  /* THE OUTCOME IS 'LOADED', NOT 'PLAYING'. This page cannot read a cross-origin provider frame's
     media element, so the honest states are: the provider announced playback (the only observed
     playback signal), or the frame is attached and awaiting play. Never "iframe load = success". */
  const info={playing:playSig,awaitingPlay:!playSig,verified:verified,server:String(s._akoServer||''),url:useUrl,
   state:playSig?(playWhy||'provider reported playback'):(verified?'player page verified — awaiting play':'framed unverified — awaiting play')};
  if(ako)akoAdd({phase:'outcome',server:info.server,url:useUrl,status:200,ok:playSig?true:null,
   reason:info.state,playbackDetected:playSig});
  return info;
 }
 if(kind===SOURCE_KIND.DIRECT_MEDIA){
  chk();
  PB.cleanupElement();
  PB._gen=myGen;
  PB.initDone=false;PB.playCalled=false;PB.autoplayBlocked=false;PB._stallT=0;PB._stallSince=0;
  /* ONE ATTEMPT = ONE TOKEN. Every callback below re-checks cur(). If a fallback (or an episode
     change) has replaced this attempt, the callback is INERT: it can never commit ACTIVE_PLAYBACK,
     never touch the UI, never cancel the attempt that replaced it and never mark it failed. */
  const attemptId=++PB._att;
  const cur=()=>myGen===PB._gen&&PB._att===attemptId&&!!(sess&&sess.check());
  const need=hdrNeed(s.headers);
  const pb=await resolvePlayback(s,v,sess,v.provider); chk();
  W.pb=pb;
  PB._st(PS.SOURCE_RESOLVED,{provider:v.provider,type:s.type,mode:pb.playbackMode,url:String(pb.playbackUrl||'').slice(0,160),needs:pb.needs});
  diag(v.provider,'playback',true,{prov:v.provider,stage:'playback',status:200,rtype:'',ms:0},
   'source RESOLVED — '+(pb.playbackMode==='relay'?'permanent relay URL (the source declares a header a page cannot send: '+(need.join(' + ')||'none')+')':'direct URL (no relay needed)')+(s.type?' · '+s.type:''));
  const pl=document.getElementById('pl');if(!pl)throw layerErr(LAYER.RENDER,'player container missing',{code:'nopl'});
  pl.classList.add('loading');
  plState('loading',need.length?'Routing through the relay…':'Loading the stream…');
  const vid=document.createElement('video');
  vid.playsInline=true;vid.preload='metadata';
  /* DELIBERATELY NO crossOrigin HERE (regression fix).
     crossOrigin='anonymous' turns EVERY media request the element makes into a CORS request. Any
     host that does not answer with Access-Control-Allow-Origin (most anime CDNs, and the relay
     worker) is then rejected by the browser even though the bytes are perfectly playable — so the
     stricter setting was rejecting usable direct MP4/WebM before the element ever tested it. The
     old direct-<video> path never set it, and nothing here needs it:
       • hls.js fetches its manifest and segments itself (XMLHttpRequest + xhrSetup), so the media
         element's CORS mode is irrelevant to the HLS path;
       • native HLS (Safari) loads the playlist through the element, and crossOrigin there has the
         same reject-unplayable-bytes effect;
       • the permanent relay is a plain cross-origin GET that needs no CORS mode to play.
     Removing it restores the permissive old behaviour without weakening any check that matters. */
  pl.insertBefore(vid,pl.firstChild);
  PB.video=PB.attachVideo();PB.video.el=vid;   /* PB.video is the WRAPPER, PB.video.el is the DOM element */
  W.video=vid;

  /* subtitles → <track> elements (kept in DOM so PB can toggle them) */
  (v.subtitles||[]).forEach(t=>{const k=document.createElement('track');
   k.kind='subtitles';k.src=t.url;k.srclang=t.language;k.label=t.label||t.language||'Subtitles';
   if(t.default)k.default=true;vid.appendChild(k)});

  PB._buildControls(vid);
  try{trackWatch(vid)}catch(e){}   /* app-level progress tracking on the ONE element */

  /* ---- ONE OUTCOME PROMISE: it settles EXACTLY ONCE, and it is what playStep() awaits.
     resolve = this source is usable (playing, or playable-but-autoplay-blocked, or ready/stalled).
     reject  = this source genuinely failed (media error, fatal HLS, play() rejected, no metadata). ---- */
  let settled=false,resolveOut=null,rejectOut=null,graceT=0;
  const outcome=new Promise((res,rej)=>{resolveOut=res;rejectOut=rej});
  const okOut=(info)=>{if(settled)return;settled=true;resolveOut(Object.assign({state:PB.state,playing:false},info||{}))};
  const badOut=(err)=>{if(settled)return;settled=true;rejectOut(err||new Error('playback failed'))};

  let playAsked=false;
  const askPlay=function(){
   if(!cur())return;
   if(playAsked)return;playAsked=true;PB.playCalled=true;
   PB._st(PS.PLAY_REQUESTED,{provider:v.provider,mode:pb.playbackMode});
   let pr;
   try{pr=vid.play()}catch(e){pr=Promise.reject(e)}
   if(!pr||typeof pr.then!=='function')pr=Promise.resolve();
   pr.then(function(){
    if(!cur())return;
    PB._st(PS.PLAY_ACCEPTED,{provider:v.provider,mode:pb.playbackMode});
    try{attAdd({stage:'play',ok:true,reason:'play() accepted by the browser',type:s.type,via:pb.playbackMode,url:String(pb.playbackUrl||'')})}catch(x){}
    if(PB.state===PS.PLAYING)return;
    /* play() was accepted but the element has not fired 'playing' yet: keep waiting (a real
       buffering start is normal), and only give up on the WATCHDOG below — never here. */
    clearTimeout(graceT);
    graceT=PB._addTimer(setTimeout(function(){
     if(!cur()||settled||PB.state===PS.PLAYING||PB.autoplayBlocked)return;
     PB._st(PS.READY,{note:'play() accepted, no playing event yet — still buffering'});
     okOut({playing:false,buffering:true});
    },3000));
   }).catch(function(e){
    if(!cur())return;
    const name=(e&&e.name)||'';
    if(name==='NotAllowedError'){
     /* AUTOPLAY BLOCKED — NOT a source failure. The stream IS playable; the browser simply will
        not start it without a gesture. The source STAYS ATTACHED, the provider is NOT penalised,
        no fallback is triggered, and the user can press Play. */
     PB.autoplayBlocked=true;PB._st(PS.AUTOPLAY_BLOCKED,{provider:v.provider});
     try{attAdd({stage:'play',ok:false,reason:'autoplay blocked (NotAllowedError) — source KEPT, not a failure',type:s.type,via:pb.playbackMode,url:String(pb.playbackUrl||'')})}catch(x){}
     pl.classList.remove('loading','err');pl.classList.add('active');plState('active','');
     wmsg('Autoplay blocked — press play to start.');
     okOut({playing:false,autoplayBlocked:true});
     return}
    if(name==='AbortError'){ /* a pause or a newer attempt interrupted play(): not a failure */
     okOut({playing:false,aborted:true});return}
    PB._st(PS.PLAYBACK_FAILED,{reason:name||'play() rejected'});
    try{attAdd({stage:'play',ok:false,reason:name||'play() rejected',type:s.type,via:pb.playbackMode,url:String(pb.playbackUrl||'')})}catch(x){}
    badOut(layerErr(LAYER.VIDEO,'play() rejected: '+(name||(e&&e.message)||'unknown'),{code:'play'}));
   });
  };

  /* ---- ONE-SHOT INITIALISATION. loadedmetadata AND loadeddata both call initOnce(); only the
     FIRST call initialises. No duplicated handlers, controls, subtitle tracks, timers. ---- */
  const initOnce=function(){
   if(PB.initDone)return;
   if(!cur())return;
   PB.initDone=true;PB._clearStart();
   PB._st(PS.METADATA_LOADED,{provider:v.provider,type:s.type,mode:pb.playbackMode,duration:Math.round(vid.duration||0)});
   try{attAdd({stage:'metadata',ok:true,trace:{prov:v.provider,type:s.type,mode:pb.playbackMode,
    url:String(pb.playbackUrl||''),elSrc:String(vid.getAttribute('src')||''),currentSrc:String(vid.currentSrc||''),
    match:PB._urlMatch(vid,pb.playbackUrl),mse:(W.pb&&W.pb.via==='hlsjs')||false,
    duration:Math.round(vid.duration||0),provider:v.provider}})}catch(x){}
   PB._updateSeek();PB._refreshCC();PB.showControls();
   /* every one of these is registered EXACTLY once */
   PB._addListener(vid,'timeupdate',function(){PB._updateSeek()});
   PB._addListener(vid,'progress',function(){PB._updateSeek()});
   PB._addListener(vid,'durationchange',function(){PB._updateSeek()});
   PB._addListener(vid,'volumechange',function(){const v0=pl.querySelector('.js-vo'),mb=pl.querySelector('.js-mu');
    if(v0)v0.value=vid.volume;if(mb)mb.textContent=vid.muted?'🔇':'🔊'});
   PB._addListener(vid,'play',function(){const p=pl.querySelector('.js-pp');if(p)p.textContent='⏸';PB._updateSeek();PB.showControls()});
   PB._addListener(vid,'ratechange',function(){const s2=pl.querySelector('.js-sp');if(s2&&parseFloat(s2.value)!==vid.playbackRate)s2.value=vid.playbackRate});
   PB._addListener(vid,'mouseenter',function(){PB.showControls()});
   PB._addListener(vid,'mousemove',function(){PB.showControls()});
   /* Leaving the player still hides the bar on a real mouse — but NEVER right after a touch, where
      the mouseleave is a synthetic artifact of the tap and would otherwise blank the 3s window. */
   PB._addListener(pl,'mouseleave',function(){if(PB._touchSeen&&Date.now()-PB._touchSeen<3000)return;
    if(cur()&&!vid.paused)PB.hideControls()});
   /* MOBILE: a touch anywhere on the player surface reveals the controls (tap-to-toggle on the
      video surface itself is already bound in PB._buildControls). */
   PB._addListener(pl,'touchstart',function(){PB.showControls()},{passive:true});
   PB._addListener(pl,'touchmove',function(){PB.showControls()},{passive:true});
   restoreProgress(vid);
   PB._addListener(vid,'timeupdate',function(){saveProgress(vid)});
   PB._addListener(vid,'ended',function(){onEnded()});
   pl.classList.remove('loading','err');pl.classList.add('active');plState('active','');
   /* the metadata arrived, so the element is real: only NOW is playback attempted */
   askPlay();
   /* WATCHDOG #2 — metadata loaded but playback never started. Distinguishes the cases instead of
      calling everything "provider failed": autoplay-blocked is already settled above; a genuine
      error settles through onError; this only covers "media is ready, the browser is chewing on it".
      The source is KEPT (never a fallback), the UI leaves the loading state, and a real error can
      still advance the chain through W.advance. */
   if(!PB._stallT){PB._stallT=1;
    PB._addTimer(setTimeout(function(){
     if(!cur()||settled||PB.state===PS.PLAYING||PB.autoplayBlocked)return;
     PB._st(PS.READY,{note:'metadata ready but no playing event within '+(ST_BUDGET.playerStall/1000)+'s — source kept'});
     okOut({playing:false,stalled:true});
    },ST_BUDGET.playerStall));}
  };

  PB._addListener(vid,'loadedmetadata',function(){if(cur())initOnce()});
  PB._addListener(vid,'loadeddata',function(){if(cur())initOnce()});
  PB._addListener(vid,'canplay',function(){if(cur())PB._st(PS.READY,{provider:v.provider})});
  PB._addListener(vid,'waiting',function(){if(cur())PB._stallSince=Date.now()});
  PB._addListener(vid,'stalled',function(){if(cur())PB._stallSince=Date.now()});

  /* ---- THE SUCCESS SIGNAL. Commit happens HERE and only here for direct media. ---- */
  const onPlaying=function(){
   if(!cur())return;
   clearTimeout(graceT);
   PB._st(PS.PLAYING,{provider:v.provider,type:s.type,mode:pb.playbackMode});
   pl.classList.remove('loading','err');pl.classList.add('active');plState('active','');
   wmsg('');
   try{attAdd({stage:'playing',ok:true,trace:{prov:v.provider,type:s.type,mode:pb.playbackMode,
    url:String(pb.playbackUrl||''),elSrc:String(vid.getAttribute('src')||''),currentSrc:String(vid.currentSrc||''),
    match:PB._urlMatch(vid,pb.playbackUrl),mse:(W.pb&&W.pb.via==='hlsjs')||false,provider:v.provider}})}catch(x){}
   noteSourceOk(v.provider,W.lang);
   commitActivePlayback(activeArgs(s,v,pb.playbackMode||'direct'));
   okOut({playing:true});
  };
  PB._addListener(vid,'playing',onPlaying);
  PB._addListener(vid,'pause',function(){if(!cur())return;if(!vid.ended)PB._st(PS.PAUSED,{provider:v.provider})});
  PB._addListener(vid,'ended',function(){if(!cur())return;PB._st(PS.ENDED,{provider:v.provider});PB.hideControls();pl.classList.add('ended')});

   const gotMeta=!!(vid.readyState&&vid.readyState>=1);
   PB._st(PS.PLAYBACK_FAILED,{code:code,msg:me.message||'',gotMeta:gotMeta});
   try{attAdd({stage:'media',ok:false,trace:{prov:v.provider,type:s.type,url:String(pb.playbackUrl||''),original:String(pb.originalUrl||''),
    host:pb.host,kind:'media',attempt:pb.playbackMode,delivered:pb.playbackMode==='relay'?'backend relay':'direct',
    elSrc:String(vid.getAttribute('src')||''),currentSrc:String(vid.currentSrc||''),match:PB._urlMatch(vid,pb.playbackUrl),
    hdrRef:hdrGet(s.headers,'referer'),hdrUA:hdrGet(s.headers,'user-agent'),
    ev:[],err:{code:code,msg:me.message||''},ok:false,ms:0}})}catch(x){}
   if(settled){   /* the source WAS playing (or ready): this is a mid-playback failure */
    if(W.advance)W.advance(layerErr(LAYER.VIDEO,'stream error during playback'+(code?' (MediaError.code '+code+')':''),{code:'stream'}));
    return}
   badOut(classifyMediaError({host:pb.host,err:{code:code}},me,need,gotMeta));
  };
  PB._addListener(vid,'error',onError);

  /* WATCHDOG #1 — source attached but NO metadata at all: a genuine failure of THIS source,
     so the chain advances (next source of the same provider, then the next provider). */
  PB._clearStart();
  PB._startT=PB._addTimer(setTimeout(function(){
   if(!cur()||settled)return;
   if(!vid.readyState||vid.readyState<1){
    PB._st(PS.PLAYBACK_FAILED,{reason:'attached but no metadata within '+(ST_BUDGET.playerStart/1000)+'s',src:String(vid.getAttribute('src')||'')});
    badOut(layerErr(LAYER.VIDEO,'no metadata within '+(ST_BUDGET.playerStart/1000)+'s',{code:'nometa'}));
   }
  },ST_BUDGET.playerStart));

  /* ---- HAND THE RESOLVED playbackUrl TO THE REAL DOM ELEMENT ----
     For direct media (mp4/webm) this is exactly the resolver's playbackUrl: the relay URL when the
     source is protected, the source URL otherwise. For HLS the same URL is used — as a native HLS
     src, or as the hls.js manifest URL. playStep() has already called PB.destroy() before this
     attempt, so no old HLS instance or old source can survive into it. */
  chk();
  if(s.type==='hls'){
   const native=!!vid.canPlayType('application/vnd.apple.mpegurl');
   if(native&&pb.playbackMode!=='relay'){
    PB._setVideoSrc(vid,pb.playbackUrl);
    PB._st(PS.SOURCE_ATTACHED,{mode:'native-hls',src:String(vid.getAttribute('src')||''),match:PB._urlMatch(vid,pb.playbackUrl)});
   }else{
    let libOk=true;
    try{await PB._loadHls()}catch(e){libOk=false}
    if(!cur())throw(Object.assign(new Error('cancelled'),{__sess:true}));
    if(!libOk||!window.Hls||!window.Hls.isSupported()){
     if(native){PB._setVideoSrc(vid,pb.playbackUrl);PB._st(PS.SOURCE_ATTACHED,{mode:'native-hls-fallback',src:String(vid.getAttribute('src')||'')})}
     else{PB.cleanupElement();throw layerErr(LAYER.VIDEO,'HLS unsupported (no hls.js, no native HLS)',{code:'hls'})}
    }else{
     PB._destroyHls();
     const h=new Hls({startLevel:-1,capLevelToPlayerSize:false});
     if(pb.playbackMode==='relay'){
      /* The MANIFEST url handed to loadSource() is ALREADY the permanent relay URL. The segment
         and key URLs inside that playlist still point at the protected origin, so THOSE need the
         relay — per request, and never applied to a URL that is already a relay URL. Result:
         video → relay → origin, never video → relay → relay → origin. */
      h.config.xhrSetup=function(xhr,u){
       let t=u;
       try{if(!isRelayUrl(u))t=relayBuild(u,s.headers||{})}catch(e){t=u}
       try{xhr.open('GET',t,true)}catch(e){}
      };
     }
     PB.hls=h;
     if(W.pb)W.pb.via='hlsjs';   /* the element's src is a MediaSource blob: by design, not a mismatch */
     PB.hlsMediaSource=true;
     PB._addListener({target:h,evt:'error',fn:function(_e,d){
      if(!cur())return;
      const det=d&&d.details;
      const kind=det&&/manifest/i.test(det)?'manifest':(det&&/frag/i.test(det))?'fragment':(det&&/key/i.test(det))?'key':
       (d&&d.type===Hls.ErrorTypes.NETWORK_ERROR)?'network':(d&&d.type===Hls.ErrorTypes.MEDIA_ERROR)?'media':'unknown';
      const fatal=!!(d&&d.fatal);
      try{attAdd({stage:'hls',ok:!fatal,reason:'HLS '+kind+(fatal?' (fatal)':' (recoverable)'),type:s.type,via:pb.playbackMode})}catch(x){}
      if(!fatal)return;
      if(!settled){PB._st(PS.PLAYBACK_FAILED,{reason:'fatal HLS '+kind});
       badOut(layerErr(LAYER.VIDEO,'fatal HLS '+kind,{code:'hls'}))}
      else if(W.advance)W.advance(layerErr(LAYER.VIDEO,'fatal HLS '+kind+' during playback',{code:'hls'}));
     },o:true});
     PB._addListener({target:h,evt:Hls.Events.MANIFEST_PARSED,fn:function(){if(!cur())return;
      try{attAdd({stage:'hls',ok:true,reason:'HLS manifest parsed (media attached)',type:s.type,via:pb.playbackMode})}catch(x){}
     }});
     PB._addListener({target:h,evt:Hls.Events.FRAG_LOADED,fn:function(){if(!cur())return;
      try{attAdd({stage:'hls',ok:true,reason:'HLS fragment loaded',type:s.type,via:pb.playbackMode})}catch(x){}
     }});
     h.loadSource(pb.playbackUrl);h.attachMedia(vid);
     PB._st(PS.SOURCE_ATTACHED,{mode:'hls.js',src:String(pb.playbackUrl||''),relay:pb.playbackMode==='relay'});
    }
   }
  }else{
   PB._setVideoSrc(vid,pb.playbackUrl);
   const mc=PB._urlMatch(vid,pb.playbackUrl);
   PB._st(PS.SOURCE_ATTACHED,{src:String(vid.getAttribute('src')||''),currentSrc:String(vid.currentSrc||''),match:mc});
   try{attAdd({stage:'attach',ok:mc,reason:mc?'DOM video.src/currentSrc carries the playbackUrl':'DOM element did not accept the playbackUrl',
    url:String(pb.playbackUrl||''),original:String(pb.originalUrl||''),mode:pb.playbackMode,type:s.type,provider:v.provider})}catch(x){}
   if(!mc){PB.cleanupElement();throw layerErr(LAYER.VIDEO,'the <video> element did not accept the resolved playbackUrl',{code:'attach'})}
  }
  chk();
  /* NEVER report success here: this only reports that the source was attached and what happened
     afterwards. "playing" is a separate stage, recorded by onPlaying(). */
  const info=await outcome;
  return info;
 }

 /* UNKNOWN → caller already chose to start this; treat as direct media but keep an explicit fallback
    that prefers provider-player if the backend has tagged it. */
 chk();
 PB.cleanupElement();
 PB._gen=myGen;
 const pl=document.getElementById('pl');if(!pl)throw layerErr(LAYER.RENDER,'player container missing',{code:'nopl'});
 const f=document.createElement('iframe');f.allow='fullscreen; picture-in-picture; autoplay';f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';
  const cur=()=>alive();
  pl.classList.add('loading');plState('loading','Loading…');
  /* AN ACTUAL FRAME SIGNAL, NOT A FIXED DELAY. A bare setTimeout(...,1500) proved nothing: it made a
     dead frame look committed. This follows the same contract as the PROVIDER_PLAYER branch — a real
     `load` event is the success signal, an `error` event or ST_BUDGET.embedLoad without a load is a
     failure — and the commit is guarded by alive(), so a stale attempt can never claim the screen. */
  PB._addListener(f,'load',()=>{if(!cur())return;
   try{attAdd({stage:'media',trace:{prov:v.provider,type:'iframe',url:s.url,host:hostOfUrl(s.url),kind:'unknown-as-frame',
    ev:['frame load'],err:null,ok:true,delivered:'direct iframe'}})}catch(x){}
   pl.classList.remove('loading','err');pl.classList.add('active');plState('active','');
   W.pb={originalUrl:s.url,playbackUrl:s.url,playbackMode:'embed',needs:[],provider:v.provider,type:'iframe',host:hostOfUrl(s.url)};
   if(cur()){noteSourceOk(v.provider,W.lang);commitActivePlayback(activeArgs(s,v,'embed'))}});
  f.src=s.url;pl.appendChild(f);PB.ifr=f;W.video=f;
  await new Promise((ok,bad)=>{let done=false;
   const fin=err=>{if(done)return;done=true;err?bad(err):ok()};
   f.addEventListener('load',()=>fin(),{once:true});
   f.addEventListener('error',()=>fin(Object.assign(new Error('frame error'),{code:'frameblocked'})),{once:true});
   PB._addTimer(setTimeout(()=>{if(!pl.classList.contains('active'))fin(Object.assign(new Error('frame load timeout'),{code:'frameblocked'}))},ST_BUDGET.embedLoad));});
  /* SUCCESS (last resort): an UNKNOWN source played as a provider frame — same defensible signal
     (a real frame load) and the same attempt guard as the PROVIDER_PLAYER path above. */
  if(alive()){noteSourceOk(v.provider,W.lang);commitActivePlayback(activeArgs(s,v,'embed'))}
};

/* Touch event handlers explicitly tied to the new module (consistent behavior on every browser). */
if(typeof window!=='undefined'){
 window.addEventListener('resize',()=>{try{PB._updateSeek()}catch(e){}});
}

/* ========== END NEW PLAYER MODULE ========== */

/* old-class compat (called by the resolver chain that did not change): keep wrapper names
   so the existing orchestration code stays untouched and the file has one player - this module. */
function setVideoSrc(vid,url){return PB._setVideoSrc(vid,url)}
function plState(c,msg){const pl=document.getElementById('pl'),st=document.getElementById('plst');if(!pl)return;
 pl.classList.remove('loading','err','active');pl.classList.add(c);if(st&&msg!=null)st.textContent=msg}
function ensurePlayer(){return PB.bootstrap()}
function clearPlayerDom(){PB.cleanupElement()}
function destroyCurrentPlayer(){PB.destroy()}
/* ---- progress glue used by the player module (restored with the orchestrator) ---- */
function restoreProgress(vid){try{const p=pnGet();if(!p||!W.m||p.id!=W.m.id||!W.ep||p.key!=W.ep.key)return;
 if(!(p.sec>15))return;
 const apply=()=>{try{if(isFinite(vid.duration)&&vid.duration&&p.sec<vid.duration-20)vid.currentTime=p.sec}catch(e){}};
 if(vid.readyState>=1&&isFinite(vid.duration)&&vid.duration)apply();
 else vid.addEventListener('loadedmetadata',apply,{once:true})}catch(e){}}
let _spT=0;
function saveProgress(vid){try{const n=Date.now();if(n-_spT<5000)return;_spT=n;
 const p=pnGet();if(!p||!W.m||p.id!=W.m.id||!W.ep||p.key!=W.ep.key)return;
 if(isFinite(vid.currentTime)&&vid.currentTime>5){p.sec=vid.currentTime;pnSet(p)}}catch(e){}}
function onEnded(){const plan=W.plan;if(!plan||!plan.sess||!plan.sess.check())return;
 if(stPrefs().autoplay)setTimeout(()=>{try{if(W.plan===plan&&plan.sess.check()&&wtOpen()&&W.ep)stepEp(1)}catch(e){}},1500)}

/* ========== WATCH <-> PROGRESS TRACKING/* ========== WATCH <-> PROGRESS TRACKING ==========
 Position-based, not watch-time-based: an episode counts as finished once the playhead reaches 3 min before the end
 (90% for episodes under 10 min) - seeking straight there counts. Stored on db.anime[id]: epst {"<ep>":"d"|"x"}
 (d finished, x skipped/dropped), cep = episode being watched, watched = count. Colours: green watching, blue watched, red skipped. */
function wtSet(p,m){m=m||W.m;const a=A(m.id);db.anime[m.id]=Object.assign({id:m.id,title:ttl(m),cover:m.coverImage.large},a,p,{eps:epTot(m)||a.eps||0,t:Date.now()})}
const wtClone=o=>{const r={};if(o)for(const k in o)r[k]=o[k];return r};
const wtImpl=(a,k)=>{const n=parseFloat(k);return Number.isInteger(n)&&n>=1&&n<=(a.watched||0)};
function epState(k){const a=A(W.m.id),st=a.epst||{};return st[k]==='d'?'d':String(a.cep)===String(k)?'c':st[k]==='x'?'x':wtImpl(a,k)?'d':''}
function epCls(k){const s=epState(k);return s=='d'?'ed':s=='c'?'ec':s=='x'?'ex':''}
function paintEps(){document.querySelectorAll('#wt .eg button[data-k]').forEach(b=>{const k=b.dataset.k;b.className=epCls(k)+(W.ep&&W.ep.key==k?' sel':'')})}
/* EMBED TRACKING: a provider <iframe> has no <video> we can read, so trackWatch() never ran for it and the
   green (watching) / red (skipped) colours never appeared. Here the episode is marked 'watching' as soon
   as the provider player is on screen, and play-time is counted while the page is visible; moving to
   another episode then finalises it with the usual rule (>= 2 min = watched/blue, less = skipped/red). */
function trackEmbed(){
 if(!W.m||!W.ep)return;
 const key=W.m.id+'|'+W.ep.key;
 if(W._embKey===key&&W._embT&&W.timers.indexOf(W._embT)>=0)return;
 W._embKey=key;
 wtStart(W.m,W.ep);
 wtTick(W.m,W.ep,()=>!document.hidden);
 W._embT=W.timers[W.timers.length-1]}
function wtStart(m,ep){m=m||W.m;ep=ep||W.ep;if(!m||!ep)return;wtFinalize(m.id,ep.key);
 const a=A(m.id),k=ep.key,n=ep.number,st=wtClone(a.epst);let top=0;
 const drop=key=>{st[key]='x';const x=parseFloat(key);if(Number.isInteger(x)&&x>top)top=x};
 if(a.cep&&String(a.cep)!==k&&st[a.cep]!=='d'&&!wtImpl(a,a.cep))drop(String(a.cep));
 if(n!=null&&n>1&&m===W.m)mergedEps().forEach(e=>{if(Number.isInteger(e.number)&&e.number>=1&&e.number<n&&!st[e.key]&&!wtImpl(a,e.key))drop(e.key)});
 if(st[k]==='x')delete st[k];
 const p={epst:st,cep:String(k)},tot=epTot(m)||a.eps||0;/* skipped/dropped episodes count as progress */
 if(top>(a.watched||0)&&(!tot||top<=tot))p.watched=top;
 const pn=pnGet();if(!pn||pn.id!=m.id||pn.key!=k)pnSet({id:m.id,key:k,num:n,sec:0,tot:epTot(m)||0,title:ttl(m),cover:m.coverImage.large});
 wtSet(p,m);if(m===W.m)paintEps()}
function wtDone(m,ep){m=m||W.m;ep=ep||W.ep;if(!m||!ep)return;const a=A(m.id),k=ep.key,n=ep.number,st=wtClone(a.epst);st[k]='d';const p={epst:st,cep:String(k)};
 const tot=epTot(m)||a.eps||0;if(n!=null&&Number.isInteger(n)&&n>=1&&(!tot||n<=tot)&&n>(a.watched||0))p.watched=n;
 wtSet(p,m);if(m===W.m)paintEps()}
/* Play-time rule: an episode that has played >= 2 min counts as watched when you move to ANY other episode (any anime);
   under 2 min it counts as dropped (still advances progress); if you stay it remains 'watching'. Pending episode kept in localStorage. */
const PNK='animeShelfPending',WT_MIN=120,pnGet=()=>stLoad(PNK,null),pnSet=o=>stSave(PNK,o);
const pnM=p=>({id:p.id,title:{english:p.title,romaji:p.title},coverImage:{large:p.cover},episodes:p.tot||0});
function wtDrop(m,ep){const a=A(m.id),k=ep.key,n=ep.number,st=wtClone(a.epst),pr={cep:''};
 if(st[k]!=='d'){if(!wtImpl(a,k))st[k]='x';const tot=epTot(m)||a.eps||0;if(n!=null&&Number.isInteger(n)&&n>=1&&(!tot||n<=tot)&&n>(a.watched||0))pr.watched=n}
 pr.epst=st;wtSet(pr,m)}
function wtFinalize(id,key){const p=pnGet();if(!p||(p.id==id&&p.key==key))return;pnSet(null);
 const m=pnM(p),ep={key:p.key,number:p.num};if(p.sec>=WT_MIN)wtDone(m,ep);else wtDrop(m,ep);wtSet({cep:''},m);if(W.m&&p.id==W.m.id)paintEps()}
function wtTick(m,ep,playing){let acc=0;const flush=()=>{if(!acc)return;const p=pnGet();if(p&&p.id==m.id&&p.key==ep.key){p.sec=(p.sec||0)+acc;pnSet(p)}acc=0};
 W.flush=flush;W.timers.push(setInterval(()=>{if(!document.hidden&&playing()){acc++;if(acc>=3)flush()}},1000))}
function wtCheck(v){if(!v||!v._m||v._d)return;const d=v.duration;if(!d||!isFinite(d))return;
 if(v.ended||v.currentTime>=(d>600?d-180:d*.9)){if(!v._s){v._s=1;wtStart(v._m,v._ep)}v._d=1;wtDone(v._m,v._ep)}}
function trackWatch(v){v._m=W.m;v._ep=W.ep;v._s=0;v._d=0;
 v.addEventListener('playing',()=>{try{if(!v._s){v._s=1;wtStart(v._m,v._ep)}}catch(e){console.warn('[watch]',e)}});
 const chk=()=>{try{wtCheck(v)}catch(e){console.warn('[watch]',e)}};
 ['timeupdate','seeked','pause','ended'].forEach(ev=>v.addEventListener(ev,chk));
 W.timers.push(setInterval(chk,1000));wtTick(v._m,v._ep,()=>!v.paused&&!v.ended);v.addEventListener('pause',()=>{try{W.flush&&W.flush()}catch(e){}})}
addEventListener('pagehide',()=>{try{wtCheck(W.video)}catch(e){}try{W.flush&&W.flush()}catch(e){}});
(async()=>{if(!st0||!st0.t||st0.root)return;try{if(st0.p)openProfile(true);if(st0.o){await openAnime(st0.o,true);if(st0.w&&cur&&cur.id==st0.o)openWatch(true)}}catch(e){console.warn('[restore]',e)}})();
</script>
