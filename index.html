<style>
:root{color-scheme:dark;--bg:#121522;--card:#1c2033;--ink:#eef0f8;--mute:#8d93ad;--ac:#ff6b8b;--gold:#ffd36b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:0 0 80px}
h1,h2{font-family:Georgia,serif;margin:0}
header{padding:16px 14px 6px}header h1{font-size:26px}
main{padding:0 14px}
h2{font-size:19px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2a2f48}
.card p{margin:0;padding:6px 7px 8px;font-size:12.5px;line-height:1.25;height:3.1em;overflow:hidden}
.badge{position:absolute;top:5px;left:5px;display:flex;gap:3px;font-size:12px}
.badge span{background:#000a;border-radius:6px;padding:1px 5px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d0f19;border-top:1px solid #2a2f48;padding-bottom:env(safe-area-inset-bottom,0)}
nav .ns{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav .ns::-webkit-scrollbar{display:none}
nav .fd{position:absolute;top:0;bottom:env(safe-area-inset-bottom,0);width:30px;z-index:1;pointer-events:none;opacity:0;transition:opacity .2s}
nav .fdl{left:0;background:linear-gradient(90deg,#0d0f19,#0d0f1900)}nav .fdr{right:0;background:linear-gradient(270deg,#0d0f19,#0d0f1900)}nav .fd.show{opacity:1}
nav button{flex:0 0 calc(100% / 5.4);background:none;border:0;color:var(--mute);padding:9px 0 8px;font-size:11px;white-space:nowrap}
.epi{width:54px;padding:8px 4px;text-align:center;border-radius:10px;border:1px solid #2a2f48;background:var(--bg);color:var(--ink);font:600 16px system-ui,sans-serif;-moz-appearance:textfield}
.epi::-webkit-outer-spin-button,.epi::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pb{height:6px;border-radius:99px;background:#2a2f48;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);border-radius:99px}
.gh{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin:16px 0 8px;cursor:pointer}
.gh img,.gh .noimg{width:40px;height:56px;object-fit:cover;border-radius:6px;flex:none}.gh small{color:var(--mute);display:block}
nav button b{display:block;font-size:19px;font-weight:400}
nav button.on{color:var(--ac)}
input[type=search],input[type=text].pw,input[type=password].pw,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);font-size:15px}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;background:var(--card);color:var(--mute);border:0;font-size:13px}
.chip.on{background:var(--ac);color:#1a0a10;font-weight:600}
.btn{padding:11px 14px;border-radius:10px;border:0;background:var(--ac);color:#1a0a10;font-weight:600;font-size:14px}
.btn.alt{background:var(--card);color:var(--ink)!important}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* Watch button: light pink base, darker fill on tap (no %) */
.wbtn{position:relative;overflow:hidden;width:100%;margin-bottom:10px;font-size:16px;background:#ffb6c8;color:#1a0a10;border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer}
.wbtn .wfill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#a21caf,#ec4899,#f472b6);transition:width .55s ease;pointer-events:none;border-radius:10px}
.wbtn .wlab{position:relative;z-index:1}
.wbtn.off,.wbtn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.35);background:#6b7280;color:#e5e7eb}
.wbtn.off .wfill,.wbtn:disabled .wfill{display:none}
.wbtn.filling{pointer-events:none}

.msg{color:var(--mute);padding:20px 0;text-align:center}
.rank{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:8px;cursor:pointer}
.rank img{width:46px;height:64px;object-fit:cover;border-radius:6px}
.rank .n{width:26px;text-align:center;font:700 18px Georgia,serif;color:var(--gold)}
.rank .t{flex:1;min-width:0}.rank .t small{color:var(--mute);display:block}
.rank .s{font:700 18px Georgia,serif;color:var(--gold)}
#ov{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:9;padding-bottom:40px}
#ov .top,#pf .top{position:sticky;top:0;background:#121522;padding:10px 14px;z-index:2}
.hero{display:flex;gap:12px;padding:0 14px}
.hero img{width:110px;border-radius:10px;align-self:flex-start}
.hero h2{margin:0 0 6px;font-size:20px}.hero small{color:var(--mute)}
.panel{background:var(--card);border-radius:12px;margin:14px;padding:12px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:0;background:#2a2f48;color:var(--ink);font-size:20px}
.tog{display:flex;gap:8px}.tog button{flex:1;padding:11px;border-radius:10px;border:1px solid #2a2f48;background:none;color:var(--ink);font-size:14px}
.tog button.on{background:var(--ac);border-color:var(--ac);color:#1a0a10;font-weight:600}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;padding:0 14px}
.ch{background:var(--card);border-radius:10px;padding:6px;text-align:center;font-size:12px;position:relative}
.ch img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#2a2f48}
.ch .fv{position:absolute;top:8px;right:8px;background:#000a;border:0;border-radius:50%;width:28px;height:28px;color:#fff;font-size:15px}
.ch .fv.on{color:var(--ac)}
.ch select{padding:4px;font-size:12px;margin-top:4px}
.rtw{margin:10px 0}.rtn{display:flex;align-items:baseline;gap:4px;font:700 24px Georgia,serif;color:var(--gold)}.rtn small{font:13px system-ui;color:var(--mute)}
.clr{margin-left:auto;background:var(--card);border:1px solid var(--border,#2a2f48);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:12px}
.rt{display:flex}.rt button{flex:1;background:none;border:0;padding:5px 0;line-height:1;color:#4a5072;font-size:26px}
.rt.top button.on{color:var(--gold)}.rt.bot button{font-size:21px}.rt.bot button.on{color:var(--ac)}
.hint{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols>div{min-width:0}.cols h2{font-size:16px;margin:12px 0 8px}
.mini{display:flex;gap:7px;background:var(--card);border-radius:10px;padding:6px;margin-bottom:7px;cursor:pointer}
.mini img{width:42px;height:60px;object-fit:cover;border-radius:6px;flex:none;background:#2a2f48}
.mini div{min-width:0;font-size:12.5px;line-height:1.25}.mini b{font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini small{display:block;color:var(--mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{cursor:pointer}.ch .rl{display:block;color:var(--gold);margin-top:3px}
#sh{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;justify-content:flex-end}
.shb{flex:1;background:#000a}.shp{background:var(--card);padding:14px;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.shh{display:flex;gap:10px;align-items:center;margin-bottom:6px}.shh img{width:52px;height:72px;object-fit:cover;border-radius:8px}
.shh div{flex:1;min-width:0}.shh small{display:block;color:var(--mute)}
.fvb{background:none;border:0;font-size:30px;color:var(--mute)}.fvb.on{color:var(--ac)}
.noimg{background:#2a2f48;border-radius:8px}.card .noimg{aspect-ratio:2/3;border-radius:0}.mini .noimg{width:42px;height:60px;flex:none}.rank .noimg{width:46px;height:64px;flex:none}.shh .noimg{width:52px;height:72px;flex:none}.ch .noimg{aspect-ratio:1}
.cnote{padding:0 14px 10px;color:var(--mute);font-size:12.5px}.cerr{margin-top:6px;color:#ff9db0}
.grp{margin-bottom:6px}
.sec{position:sticky;top:58px;z-index:1;background:var(--bg);padding:8px 14px;font-size:13px;border-bottom:1px solid #2a2f48;margin-bottom:10px}
.sec b{color:var(--ac);margin-right:6px}.sec small{color:var(--mute);margin-left:6px}
header{padding:8px 14px 6px}
.madeby{flex:1;text-align:center;font-family:"Dancing Script","Segoe Script","Snell Roundhand","Brush Script MT","Apple Chancery",cursive;font-style:italic;font-size:22px;line-height:1.15;color:#e8a46a;padding:0 6px;margin-right:28px}
.hd{display:flex;align-items:center;justify-content:space-between}.logo{height:64px;width:auto;display:block}
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink);max-width:96px;font-size:12px;padding:4px}
.prof span{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av,.avl{border-radius:50%;object-fit:cover;border:2px solid var(--ac);background:#2a2f48}.av{width:54px;height:54px}.avl{width:96px;height:96px;border-width:3px}
.av.ph,.avl.ph{display:flex;align-items:center;justify-content:center;font:700 24px Georgia,serif;color:var(--ac)}
#pf{position:fixed;inset:0;background:var(--bg);overflow:auto;display:none;z-index:10;padding-bottom:40px}
.pfh{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 14px}
.pni{width:80%;text-align:center;padding:11px;border-radius:10px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);font-size:17px}
.avg{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin-top:8px}
.avg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;cursor:pointer;background:#2a2f48}
.pl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pchip{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink);width:74px;font-size:12px;padding:2px}
.pchip .av{width:58px;height:58px}.pchip.on .av{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pchip span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plus{width:58px;height:58px;border-radius:50%;border:2px dashed var(--mute);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--mute)}
details summary{color:var(--mute);font-size:13px;cursor:pointer}
/* WATCH SYSTEM */
#wt{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0)}
#wt .wtop{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 14px;display:flex;gap:8px;align-items:center}
.pl{position:relative;background:#000;aspect-ratio:16/9;width:100%;max-height:75vh;overflow:hidden;user-select:none;touch-action:manipulation}
.pl video,.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pl .st{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;color:#fff;background:#000c;z-index:5;font-size:14px}
.pl.loading .st,.pl.err .st{display:flex}
.pl.loading .st{align-items:flex-end;padding-bottom:14px;background:#000;font-size:13px;opacity:.8}
.pl.loading::after{content:'';position:absolute;left:50%;top:50%;width:64px;height:64px;margin:0;border:6px solid #ffffff33;border-top-color:#fff;border-radius:50%;z-index:8;animation:plspin .8s linear infinite;pointer-events:none}
@keyframes plspin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.pl .gl{position:absolute;inset:0;z-index:4;background:transparent}
/* The control bar the JS creates is .pl__controls > .pl__seek + .row2. The stylesheet only styled
   .ctl/.seek/.row2 (bare), so the bar existed in the DOM but was INVISIBLE and UNCLICKABLE.
   Every class below is one the player actually creates (see PB._buildControls). */
.pl .pl__controls{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:6px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:12px;opacity:0;transition:opacity .18s ease;pointer-events:none}
.pl.ui .pl__controls{opacity:1;pointer-events:auto}
.pl .pl__seek{position:relative;height:6px;background:#ffffff33;border-radius:3px;margin:2px 0 8px;cursor:pointer;touch-action:none}
.pl .pl__seek::after{content:'';position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.pl .pl__seek .buf,.pl .pl__seek .pos{position:absolute;top:0;left:0;bottom:0;border-radius:3px;pointer-events:none}
.pl .pl__seek .buf{background:#ffffff66}.pl .pl__seek .pos{background:var(--ac)}
.pl .pl__controls .row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl .pl__controls .tm{font-variant-numeric:tabular-nums;opacity:.85;margin-left:auto;margin-right:auto}
.pl .pl__controls .b{background:#0009;border:0;color:#fff;min-width:36px;height:32px;border-radius:6px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.pl .pl__controls .b:hover{background:#000c}.pl .pl__controls .b.on{background:var(--ac);color:#1a0a10}
.pl .pl__controls select.b{width:auto;padding:0 6px;font-size:12px;min-width:54px}
.pl .pl__controls .vo{accent-color:var(--ac);width:64px;max-width:30vw}
/* CENTER PLAY/PAUSE OVERLAY (added). It is shown/hidden by the SAME .pl.ui class as the control
   bar, so it follows the one 3s hide timer. The wrapper never blocks the video (pointer-events:none)
   and the button itself is only interactive while .ui is set — so it cannot permanently block taps. */
.pl .pl__center{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .18s ease}
.pl.ui .pl__center{opacity:1}
.pl .pl__center button{pointer-events:none;width:76px;height:76px;border-radius:50%;border:0;background:#000000a8;color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 14px #0007;transition:background .15s ease,transform .15s ease}
.pl.ui .pl__center button{pointer-events:auto}
.pl .pl__center button:hover{background:#000000cc}
.pl .pl__center button:active{transform:scale(.94)}
.pl.locked .pl__center,.pl.ended .pl__center{display:none}
@media(max-width:520px){.pl .pl__center button{width:64px;height:64px;font-size:26px}}
.pl .pl__tip{position:absolute;top:42%;background:#000d;color:#fff;padding:8px 14px;border-radius:99px;z-index:7;display:none;font-weight:700;font-size:14px;pointer-events:none;opacity:.95}
.pl__tip.l{left:8%}.pl__tip.r{right:8%}.pl__tip.center{left:50%;transform:translateX(-50%)}
.pl.locked .pl__controls,.pl.ended .pl__controls{display:none}
.pl__nx{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000000cc;color:#fff}
.pl.ended .pl__nx{display:flex}
.pl__tip.l{left:8%}.pl__tip.r{right:8%}.pl__tip.center{left:50%;transform:translateX(-50%)}
.wsec{padding:0 14px}.wsec h3{margin:14px 0 6px;font-size:13px;color:var(--mute);letter-spacing:.05em}
.vb{display:flex;gap:8px;flex-wrap:wrap}
.vb button{flex:1 1 180px;min-height:46px;border-radius:10px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);text-align:left;padding:8px 12px}
.vb button.on{border-color:var(--ac);background:#ff6b8b22}.vb button:disabled{opacity:.45}
.vb small{display:block;color:var(--mute)}
.vb button .dot{float:left;margin-right:6px;color:var(--ac)}
.vb button.req{border-style:dashed;opacity:.85}
.vb button .tagn{color:var(--ac);font-size:11px}
/* ---- PROVIDER BUTTON: label, audio tag and state note are THREE separate elements, never one
   concatenated string, so a status can never touch the label (the "Randomauto" / "Randomrequested"
   bug). Every button keeps the SAME node structure whether or not a status is present, so a state
   can be patched in place without re-rendering the panel (and therefore without reloading a player). */
.vb button.srvbtn .lbl{display:inline}
.vb button.srvbtn .tagc{display:block;margin-top:1px;font-size:10.5px;font-weight:400;line-height:1.25;color:var(--mute);letter-spacing:.02em}
.vb button.srvbtn .tagn{display:block;min-height:13px;margin-top:2px;font-size:11px;font-weight:600;line-height:13px;color:var(--ac)}
.vb button.srvbtn[data-st="checking"] .tagc{color:#fbbf24}
.vb button.srvbtn[data-st="unknown"] .tagc{color:var(--mute)}
.vb button.srvbtn[data-st="off"] .tagc{display:none}
.pf{padding:2px 14px 6px;font-size:13px;color:var(--ink)}
.pf .hint{color:var(--mute)}
.rq{padding:0 14px 6px;font-size:12px;color:var(--gold)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-height:220px;overflow:auto}
.eg button{min-height:40px;border-radius:8px;border:1px solid #2a2f48;background:var(--card);color:var(--ink)}.eg button.on{background:var(--ac);color:#1a0a10}
#wmsg{padding:8px 14px;color:var(--gold);font-size:13px;min-height:20px}
.eg button.ed{background:#1e3a8a;border-color:#1e3a8a;color:#fff}.eg button.ec{background:#86efac;border-color:#86efac;color:#052e16}.eg button.ex{background:#dc2626;border-color:#dc2626;color:#fff}.eg button.sel{outline:2px solid #fff;outline-offset:1px}
.lg{font-size:12px;color:var(--mute);margin:6px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 8px;vertical-align:middle}
.xb{background:#000b;color:#fff;border:0;border-radius:50%;width:32px;height:32px;font-size:14px;flex:none;cursor:pointer}
.card .xb{position:absolute;top:6px;right:6px;z-index:2}.rank .xb,.gh .xb{margin-left:auto}

.tabs{display:flex;gap:8px;margin:0 14px 10px}
.tab{flex:1;padding:10px 12px;border-radius:99px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}
.tab.on.anime{background:rgba(236,72,153,.18);border-color:#ec4899;color:#fbcfe8}
.tab.on.char{background:rgba(249,115,22,.18);border-color:#f97316;color:#fed7aa}
.sug{display:flex;flex-direction:column;gap:6px;margin:0 14px 8px}
.sugitem{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid #2a2f48;cursor:pointer}
.sugitem small{color:var(--mute)}
.vb button.off{opacity:.45;filter:grayscale(.5)}
/* ---- WATCH SELECTOR: Random on its OWN top row, then AUDIO | PROVIDER side by side.
   Random is emitted before and outside this grid, so it is a top row and never a third column. ---- */
.wpick{padding:0 14px}
.wpick h3{margin:14px 0 6px;font-size:13px;color:var(--mute);letter-spacing:.05em}
/* RANDOM: its own FULL-WIDTH row above the two columns, with a clear gap below it. The status sits on
   its own line — smaller, muted — so it can never run into the label. */
.wrand{display:flex;margin:0 0 16px}
.wrand button{flex:1 1 100%;min-height:54px;border-radius:12px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 12px;font-size:15px;font-weight:600}
.wrand button.on{border-color:var(--ac);background:#ff6b8b22}
.wrand button .rline{display:flex;align-items:center;gap:6px;line-height:1.2}
.wrand button .dot{float:none;margin-right:0;color:var(--ac)}
.wrand button .tagn{display:block;min-height:13px;font-size:11px;font-weight:400;line-height:13px;color:var(--mute);letter-spacing:.02em}
.wrand button.on .tagn{color:var(--ac)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.wcol{min-width:0}
.wcol h4{margin:0 0 6px;font-size:11px;color:var(--mute);letter-spacing:.08em;font-weight:700}
.wcol .vb{display:flex;flex-direction:column;gap:6px}
.wcol .vb button{flex:0 0 auto;min-height:46px;border-radius:10px;border:1px solid #2a2f48;background:var(--card);color:var(--ink);text-align:left;padding:8px 10px;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.wcol .vb button .dot{float:left;margin-right:5px;color:var(--ac)}
.tagc{color:var(--mute);font-size:11px}
.wempty{color:var(--mute);font-size:13px;padding:6px 0}
@media(max-width:430px){.wgrid{gap:8px}.wcol .vb button{font-size:12px;padding:7px 8px;min-height:44px}.wcol h4{font-size:10px}.wrand button{min-height:50px;font-size:14px}}
.wrow{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px}
.wcard{flex:0 0 150px;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer}
.wcard img{width:100%;height:90px;object-fit:cover;display:block}
.wc-t{padding:8px}
.wc-t b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc-t small{color:var(--mute);font-size:12px}
.cq{width:100%;margin:6px 0 10px;padding:9px 12px;border-radius:12px;border:1px solid #2a2f48;background:var(--card);color:var(--ink)}

/* ---- Relations (prequel / sequel / other) ---- */
.relsec{padding:0 14px 6px}.relsec h3{margin:12px 0 8px;font-size:14px;color:var(--mute);letter-spacing:.04em}
.relrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.relrow::-webkit-scrollbar{height:4px}.relrow::-webkit-scrollbar-thumb{background:#2a2f48;border-radius:4px}
.relcard{flex:0 0 110px;background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;border:0;padding:0;color:var(--ink);text-align:left;display:flex;flex-direction:column}
.relcard img,.relcard .noimg{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2a2f48;flex:none}
.relcard .rt{padding:7px 8px 9px;min-height:3.4em;display:flex;flex-direction:column;gap:3px;flex:1}
.relcard .rt b{font-size:12px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.relcard .rt small{display:block;color:var(--mute);font-size:10.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- Season navigator on watch page ---- */
.snav{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;padding:0 14px 12px;margin-top:18px;align-items:stretch}
.snav .sc{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2a2f48;background:#1a1e2e;cursor:pointer;
 min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.snav .sc.mid{min-height:134px;cursor:default;border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.snav .sc.disabled{opacity:.45;cursor:default;pointer-events:none}
.snav .sc.unreleased{opacity:.5;cursor:default;pointer-events:none;filter:grayscale(.35)}
.snav .sc .nm.sub{font-size:10px;font-weight:700;color:#f9a8d4;padding:0 9px 10px;margin-top:-4px;text-transform:none;letter-spacing:0;text-shadow:0 1px 3px #000c}
.snav .sc .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.38;filter:saturate(.7);z-index:0}
/* Dark scrim so title text never sits on a bright poster edge */
.snav .sc::after{content:'';position:absolute;left:0;right:0;bottom:0;height:78%;
 background:linear-gradient(transparent,rgba(8,10,18,.55) 28%,rgba(8,10,18,.92) 100%);z-index:1;pointer-events:none}
.snav .sc .lab{position:relative;z-index:2;padding:0 9px 3px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:rgba(255,255,255,.9);text-shadow:0 1px 3px #000c;flex:none}
.snav .sc.mid .lab{color:var(--ac)}
.snav .sc .nm{position:relative;z-index:2;padding:0 9px 11px;font-size:11px;font-weight:600;line-height:1.35;color:#fff;
 text-shadow:0 1px 4px #000d;overflow:hidden;word-break:break-word;overflow-wrap:anywhere;
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;max-height:calc(1.35em * 3)}
.snav .sc.mid .nm{font-size:12px;-webkit-line-clamp:3;max-height:calc(1.35em * 3)}
@media(max-width:430px){
 .snav{gap:6px}
 .snav .sc{min-height:110px}
 .snav .sc.mid{min-height:124px}
 .snav .sc .nm{font-size:10.5px;padding:0 7px 9px;line-height:1.3;max-height:calc(1.3em * 3)}
 .snav .sc.mid .nm{font-size:11px}
 .snav .sc .lab{padding:0 7px 2px;font-size:8.5px}
 .relcard{flex:0 0 100px}
}
/* ---- Detail loading bar (dark pink / purple) ---- */
.ldwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;padding:24px 20px;gap:18px}
.ldbar{width:min(280px,72vw);height:14px;border-radius:99px;background:#2a1a28;border:1px solid #ec489955;box-shadow:0 0 18px #ec489933,inset 0 0 8px #0006;overflow:hidden;position:relative}
.ldbar i{display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#a21caf,#ec4899,#f472b6);box-shadow:0 0 12px #ec4899aa;transition:width .35s ease}
.ldbar.indeterminate i{width:40%;animation:ldslide 1.4s ease-in-out infinite}
@keyframes ldslide{0%{transform:translateX(-100%)}50%{transform:translateX(180%)}100%{transform:translateX(-100%)}}
.ldpct{font:600 15px system-ui,sans-serif;color:#f9a8d4;letter-spacing:.04em;min-height:1.2em}
.ldmsg{color:var(--mute);font-size:13px;text-align:center}
/* Thin healthbar for related-anime loading (detail page) */
.rel-ld{padding:10px 0 6px;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.rel-ld .rel-ldbar{height:6px;border-radius:99px;background:#2a1a28;border:1px solid #ec489944;overflow:hidden;position:relative;box-shadow:0 0 10px #ec489922}
.rel-ld .rel-ldbar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#a21caf,#ec4899,#f472b6);box-shadow:0 0 8px #ec4899aa;animation:relLd 1.35s ease-in-out infinite}
@keyframes relLd{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.rel-ld .rel-ldmsg{font-size:12px;color:#f9a8d4;opacity:.85;letter-spacing:.02em}

/* ---- Theme system ---- */
.pfgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 20px;align-items:start}
@media(max-width:720px){.pfgrid{grid-template-columns:1fr}}
.pfcol{min-width:0}
.pfcol>h2{font-size:16px;margin:0 0 10px;color:var(--ink)}

.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:7px}
.th-chip{position:relative;border:2px solid #2a2f48;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;background:var(--card);color:var(--ink);min-height:54px;display:flex;flex-direction:column;align-items:stretch}

.th-chip.dis{opacity:.38;filter:grayscale(.55);pointer-events:none;cursor:not-allowed}
.th-chip.dis::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 4px,#0005 4px,#0005 8px)}
body.theme-light{color-scheme:light}

body.theme-light #ov .top,body.theme-light #pf .top{background:var(--bg)}

body.theme-light,body.theme-light .pfcol>h2,body.theme-light .panel b,body.theme-light .panel,
body.theme-light .btn.alt,body.theme-light .clr,body.theme-light .pni,

/* DATA RULES, enforced in code below (see track()):
   1. All saved data lives in `db`. Any change to it is saved and synced automatically.
   2. Every change stamps the record's `t`, so the sync merge knows which copy is newer.
   3. Deleting or undefining saved data throws an error. Store a flag instead (fav:false), or deleted sync would bring it back.
   4. Never write to the raw object directly, only through `db`. */
const KEY0='animeShelfV1';
let profiles=[],curP='main';
try{profiles=JSON.parse(localStorage.getItem('animeShelfProfiles')||'[]')}catch(e){}
if(!Array.isArray(profiles)||!profiles.length)profiles=[{id:'main',name:'Guest',avatar:'',file:'data.json',c:0,t:0}];
/* The built-in Guest profile (id 'main'): always exists, always named Guest, never removed, no password. A fresh browser opens on it. */
const GUEST='main';
function fixGuest(a){let g=a.find(p=>p.id==GUEST);if(!g){g={id:GUEST,avatar:'',file:'data.json',c:0,t:0};a.push(g)}
 g.name='Guest';g.hidden=false;delete g.pw;return a}
fixGuest(profiles);
try{curP=localStorage.getItem('animeShelfCurP')||'main'}catch(e){}
if(!profiles.some(p=>p.id==curP&&!p.hidden))curP=(profiles.find(p=>!p.hidden)||profiles[0]).id;
const keyFor=id=>id=='main'?KEY0:KEY0+':'+id;
let KEY=keyFor(curP);
let db={anime:{},chars:{}},tab='home',rk={kind:'anime',sort:'high'},cur=null,curChars=[];
try{db=Object.assign(db,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const RAW=Symbol('raw');let raw;
function blocked(msg){setStat(msg,true);throw new Error(msg)}
function setDb(o){raw=o;db=track(o,0,null)}
function track(o,depth,entry){return new Proxy(o,{
 get(t,k){if(k===RAW)return t;const v=t[k];return v&&typeof v=='object'?track(v,depth+1,depth==1?v:entry):v},
 set(t,k,v){
  if(v===undefined)blocked('Blocked: saving undefined would erase data. Use null or a flag like fav:false.');
  if(v&&v[RAW])v=v[RAW];
  t[k]=v;
  if(depth==1&&v&&typeof v=='object'&&!Array.isArray(v)&&k!=='t')v.t=Date.now();
  else if(depth>=2&&entry&&k!=='t')entry.t=Date.now();
  save();return true},
 deleteProperty(t,k){
  if(depth<=1)blocked('Blocked: deleting saved records would be undone by sync. Store a flag like fav:false instead.');
  delete t[k];if(entry)entry.t=Date.now();save();return true}
})}

/* Records with nothing set (no favourite, watchlist, rating, progress) are shrunk to {id,t}. The stub stays so sync

const EMPTY={anime:a=>!a.fav&&!a.watch&&!a.rating&&!(a.watched>0)&&!a.cep&&!(a.dis&&Object.keys(a.dis).length)&&!(a.epst&&Object.keys(a.epst).length),chars:c=>!c.fav&&!c.rating&&!c.gset&&!c.custom};

   are discarded by the SR.n generation token, and switching tabs keeps the query text. */

 $('#m').innerHTML=`<div class="tabs"><button class="tab ${cat=='anime'?'on anime':''}" onclick="setCat('anime')">Anime</button><button class="tab ${cat=='char'?'on char':''}" onclick="setCat('char')">Characters</button></div>`+

  `<div id="sug" class="sug"></div><div id="res"></div>`;
 drawSearch();if(cat==='char'){const e=$('#qc')||$('#qa');if(e)e.focus()}else if(!SR.q)$('#q').focus();

function setCat(c){if(SR.cat===c)return;SR.cat=c;const q=effQ();
 SR.a=[];SR.c=[];SR.err='';SR.warn=[];SR.kn=0;SR.n++;search();if(q)doSearch()}
function onQ(v){SR.q=String(v||'');armSearch()}
function onQC(v){SR.qc=String(v||'');armSearch()}
function onQA(v){SR.qa=String(v||'');armSearch()}
/* One short debounce for every field; an emptied field clears the result area instead of firing a
   pointless request. */
function armSearch(){clearTimeout(sTimer);const q=effQ();
 if(!q){SR.n++;SR.a=[];SR.c=[];SR.err='';SR.warn=[];drawSearch();return}

 R.innerHTML=warns+`<h2>Characters</h2>${SR.kn?`<small class="hint">${SR.kn} extra from Kitsu</small>`:''}`+(SR.c.length?`<div class="grid">${SR.c.map(c=>mini(c.img,c.name,c.anime,`openChar(${c.id})`,cb(c))).join('')}</div>`:'<div class="msg">No characters found</div>');

async function kitsuSearch(q){
 /* Kitsu's characters endpoint often 500s with include=primaryMedia — never use it.
    Try the query as-is, then Title-Case, with a longer timeout and one retry. */
 const attempts=[String(q||'').trim()];
 const tc=attempts[0].replace(/\b\w/g,c=>c.toUpperCase());
 if(tc&&tc!==attempts[0])attempts.push(tc);
 for(const term of attempts){
  if(!term)continue;
  for(let tryN=0;tryN<2;tryN++){
   try{
    const d=await fbJson('https://kitsu.io/api/edge/characters?filter%5Bname%5D='+encodeURIComponent(term)+'&page%5Blimit%5D=20',4500,KH);
    const rows=(d.data||[]).map(c=>{const a=c.attributes||{};
     return{name:a.canonicalName||(a.names&&(a.names.en||a.names.en_jp))||'',img:kimg(a.image),anime:'',kid:+c.id}}).filter(x=>x.name&&x.kid);
    if(rows.length)return rows;
   }catch(e){}
  }
 }
 return[]
}
/* Jikan character search — offline fallback when AniList/Kitsu miss. Longer timeout + retry. */
async function jikanCharSearch(q){
 const term=String(q||'').trim();if(!term)return[];
 for(let tryN=0;tryN<2;tryN++){
  try{
   const j=await fbJson('https://api.jikan.moe/v4/characters?q='+encodeURIComponent(term)+'&limit=20',5000);
   const rows=((j&&j.data)||[]).map(c=>{
    const img=(c.images&&c.images.jpg&&(c.images.jpg.image_url||c.images.jpg.small_image_url))||'';
    return{name:c.name||'',img:img,anime:'',jid:c.mal_id}}).filter(x=>x.name&&x.jid);
   if(rows.length)return rows;
  }catch(e){}
  await new Promise(r=>setTimeout(r,600))
 }
 return[]
}

  try{const d=await gql(`query($s:String){c:Page(perPage:5){characters(search:$s,sort:SEARCH_MATCH){id name{full}}}}`,{s:name},{once:1,ms:2000});
   const list=(((d||{}).c||{}).characters)||[];

function mergeSearchChars(al,ki){
 const out=[],sk=new Map();let added=0;
 al.forEach(c=>{const m=c.media.nodes[0],u=(c.image&&c.image.medium)||'',o={id:c.id,name:c.name.full,img:noPic(u)?'':u,gender:c.gender||'',aid:m?m.id:0,anime:m?ttl(m):''};
  CC[c.id]=o;out.push(o);keysOf(c.name).forEach(k=>sk.set(k,o))});
 ki.forEach(x=>{const k=nk(x.name)||x.name.toLowerCase(),ex=sk.get(k);
  if(ex){if(noPic(ex.img)&&!noPic(x.img))ex.img=x.img;return}
  const o={id:2e9+x.kid,name:x.name,img:noPic(x.img)?'':x.img,gender:'',aid:0,anime:x.anime};
  CC[o.id]=o;out.push(o);sk.set(k,o);added++});
 return{list:out,added};
}
/* ---- CHARACTER SEARCH IS PROGRESSIVE ----
   The old body awaited AniList AND Kitsu together (Promise.allSettled), so a slow or dead Kitsu
   held back results AniList had already delivered. Every source now renders the moment it answers:
   AniList first, Kitsu merged in afterwards WITHOUT replacing what is already on screen, and each
   source is still tried independently, so one failing source never blanks the other's results.
   SR.n is the generation token: a reply for a superseded query is dropped, never rendered.
   Optional fields: "anime title" narrows candidates (and, when given, resolves that anime's own
   character list directly, which is both faster and exact); "character name" is the ordinary path
   and works on its own. */
function animeTitleMatch(o,qa){if(!qa)return false;
 const t=charNorm(qa),a=charNorm(o&&o.anime||'');if(!a||!t)return false;
 return a.indexOf(t)>=0||t.split(' ').filter(Boolean).every(w=>a.indexOf(w)>=0)}
function orderChars(qa){SR.c.forEach(o=>{o.matched=animeTitleMatch(o,qa)});
 /* AniList before Kitsu, and (when an anime was named) its own characters first. Array.sort is
    stable, so the arrival order inside each group is preserved. */
 SR.c.sort((x,y)=>((y.matched?1:0)-(x.matched?1:0))||((x.src==='anilist'?0:1)-(y.src==='anilist'?0:1))||(x.t0-y.t0))}
async function doSearch(){
 const cat=SR.cat||'anime',my=++SR.n;
 if(cat==='anime'){
  const q=(($('#q')&&$('#q').value)||SR.q||'').trim();SR.q=q;
  if(!q){SR.a=[];SR.c=[];SR.err='';SR.warn=[];drawSearch();return}
  const R=$('#res');if(R)R.innerHTML='<div class="msg">Searching…</div>';
  let A1=null;try{A1=await gql(`query($s:String){a:Page(perPage:20){media(type:ANIME,search:$s,sort:SEARCH_MATCH){${FIELDS}}}}`,{s:q},{once:1,ms:2000})}catch(e){}
  if(my!==SR.n)return;
  SR.a=[];SR.err='';SR.warn=[];
  if(A1&&A1.a&&A1.a.media)SR.a=A1.a.media;
  else{const fb=await fbSearch(q);if(my!==SR.n)return;if(fb)SR.a=fb;else SR.err='Anime search failed. Check your internet connection.'}
  drawSearch();return}
 const qn=String(SR.qc||'').trim(),qa=String(SR.qa||'').trim(),q=qn||qa;
 /* Keep SR.q (anime search) independent — never copy character query into it. */
 if(!q){SR.c=[];SR.err='';SR.warn=[];drawSearch();return}
 const R=$('#res');if(R)R.innerHTML='<div class="msg">Searching…</div>';
 SR.c=[];SR.kn=0;SR.err='';SR.warn=[];
 const ids=new Set(),names=new Set(),t0=Date.now();
 const add=(list,src)=>{if(my!==SR.n)return 0;let n=0;
  (list||[]).forEach(o=>{const k=charNorm(o.name)+'|'+charNorm(o.anime||'');
   if(!o.name||ids.has(o.id)||(names.has(k)&&k))return;
   ids.add(o.id);if(k)names.add(k);o.src=src;o.t0=t0;SR.c.push(o);n++});
  orderChars(qa);drawSearch();return n};
 const warn=(t)=>{if(my!==SR.n)return;if(!SR.warn.includes(t))SR.warn.push(t);drawSearch()};
 /* AniList name search — allow a normal multi-try gql, not the ultra-short once path only. */
 const pName=(async()=>{if(!qn)return[];
  try{
   let d=null;
   try{d=await gql(`query($s:String){c:Page(perPage:24){characters(search:$s,sort:SEARCH_MATCH){id name{full alternative}image{medium}gender media(perPage:1,sort:POPULARITY_DESC){nodes{id title{romaji english}}}}}}`,{s:qn},{once:1,ms:2800})}catch(e){}
   if(!d){try{d=await gql(`query($s:String){c:Page(perPage:24){characters(search:$s,sort:SEARCH_MATCH){id name{full alternative}image{medium}gender media(perPage:1,sort:POPULARITY_DESC){nodes{id title{romaji english}}}}}}`,{s:qn})}catch(e){throw e}}
   return (((d||{}).c||{}).characters||[]).map(c=>{const m=(c.media&&c.media.nodes&&c.media.nodes[0])||null,u=(c.image&&c.image.medium)||'';
    const o={id:c.id,name:c.name.full,img:noPic(u)?'':u,gender:c.gender||'',aid:m?m.id:0,anime:m?ttl(m):''};CC[c.id]=o;return o});
  }catch(e){warn('AniList characters failed: '+emsg(e)+'.');return[]}})();
 /* AniList characters of a named anime */
 const pAnime=(async()=>{if(!qa)return[];
  try{
   let s1=null;
   try{s1=await gql(`query($s:String){a:Page(perPage:1){media(type:ANIME,search:$s,sort:SEARCH_MATCH){id title{romaji english}}}}`,{s:qa},{once:1,ms:2500})}catch(e){}
   if(!s1){try{s1=await gql(`query($s:String){a:Page(perPage:1){media(type:ANIME,search:$s,sort:SEARCH_MATCH){id title{romaji english}}}}`,{s:qa})}catch(e){}}
   const mm=s1&&s1.a&&s1.a.media&&s1.a.media[0];if(!mm)return[];
   const d=await gql(`query($id:Int){Media(id:$id){characters(page:1,perPage:50,sort:[ROLE,FAVOURITES_DESC]){nodes{id name{full alternative}image{medium}gender}}}}`,{id:mm.id},{once:1,ms:3000});
   const nodes=(((d||{}).Media||{}).characters||{}).nodes||[];
   return nodes.map(n=>{const u=(n.image&&n.image.medium)||'',o={id:n.id,name:n.name.full,img:noPic(u)?'':u,gender:n.gender||'',aid:mm.id,anime:ttl(mm)};CC[o.id]=o;return o});
  }catch(e){warn('AniList anime-characters failed: '+emsg(e)+'.');return[]}})();
 /* Kitsu + Jikan — start immediately in parallel with AniList, not after it fails. */
 const pK=(async()=>{if(!qn&&!q)return[];
  try{const r=await kitsuSearch(qn||q);
   return(r||[]).map(x=>{const o={id:2e9+x.kid,name:x.name,img:noPic(x.img)?'':x.img,gender:'',aid:0,anime:x.anime||'',_kitsu:1,kid:x.kid};CC[o.id]=o;return o})}
  catch(e){warn('Kitsu characters failed: '+emsg(e)+'.');return[]}})();
 const pJ=(async()=>{if(!qn&&!q)return[];
  try{const r=await jikanCharSearch(qn||q);
   return(r||[]).map(x=>{const o={id:3e9+x.jid,name:x.name,img:noPic(x.img)?'':x.img,gender:'',aid:0,anime:x.anime||'',_jikan:1,jid:x.jid};CC[o.id]=o;return o})}
  catch(e){warn('Jikan characters failed: '+emsg(e)+'.');return[]}})();
 /* Progressive merge: paint as each source lands. Never declare "none found" until ALL settle. */
 const jobs=[
  pName.then(list=>{if(my!==SR.n)return;add(list,'anilist')}),
  pAnime.then(list=>{if(my!==SR.n)return;add(list,'anilist')}),
  pK.then(list=>{if(my!==SR.n)return;const n=add(list,'kitsu');if(n)SR.kn+=n}),
  pJ.then(list=>{if(my!==SR.n)return;const n=add(list,'jikan');if(n)SR.kn+=n})
 ];
 await Promise.all(jobs);
 if(my!==SR.n)return;
 if(SR.c.length){SR.err='';drawSearch();return}
 if(SR.warn.length)SR.err='Character search failed. Check your internet connection and try again.';
 else SR.err='No characters found. Check the spelling, or leave the character name empty and search by anime title.';
 drawSearch();
}

function progressTabMedia(a){if(!relC[a.id]&&cur&&String(cur.id)===String(a.id))return cur;

 return {id:a.id,episodes:r.plannedEpisodes??r.eps??a.eps??null,plannedEpisodes:r.plannedEpisodes??r.eps??a.eps??null,

let relJob=null;
/* Resolve missing released-episode counts for Progress rows showing "?".
   Opening a detail page already does this via full Media fetch; this runs the same
   store path automatically when Progress opens or when "?" rows remain. */
let _progRelJob=null;
async function ensureProgReleased(){
 if(_progRelJob)return _progRelJob;
 const need=Object.values(db.anime).filter(a=>((a.watched||0)>0||a.cep)&&totEp(a)==null).map(a=>a.id);
 if(!need.length)return;
 _progRelJob=(async()=>{
  try{
   for(let i=0;i<need.length;i+=40){
    const ids=need.slice(i,i+40);let media=[];
    try{const d=await gql(`query($ids:[Int]){Page(perPage:40){media(id_in:$ids,type:ANIME){id idMal episodes status nextAiringEpisode{episode} relations{edges{relationType node{id type format status episodes seasonYear title{romaji english} coverImage{large}}}}}}`,{ids:ids},{once:1,ms:3500});
     media=(d.Page&&d.Page.media)||[]}catch(e){}
    for(const id of ids){
     try{
      let m=media.find(x=>x&&String(x.id)===String(id));
      if(!m)m=await fbDetail(id);
      if(!m)continue;
      const f=episodeFacts(m);
      if((f.airing&&f.releasedEpisodes==null)||!f.status){try{await ensureIdentity(m)}catch(e){}}
      const p=progressEpisodeCounts(m),old=relC[id]||{};
      relC[id]=Object.assign({},old,{f:Date.now(),pv:2,eps:p.plannedEpisodes,plannedEpisodes:p.plannedEpisodes,
       releasedEpisodes:p.releasedEpisodes,st:episodeFacts(m).status,nextAiringEpisode:m.nextAiringEpisode||old.nextAiringEpisode||null,seq:old.seq||[]});
     }catch(e){}
    }
   }
   try{localStorage.setItem('animeShelfRel',JSON.stringify(relC))}catch(e){}
   if(tab==='prog')drawProg();
  }finally{_progRelJob=null}
 })();
 return _progRelJob
}

async function loadRelOnce(){
 if(relBusy)return;
 const need=Object.values(db.anime).filter(a=>((a.watched||0)>0||a.cep)).map(a=>a.id);
 if(!need.length)return;
 relBusy=true;relErr='';if(tab=='prog')drawProg();
 const store=async(m,authoritativeRelations)=>{
  /* Reuse the existing combined metadata only when the main response lacks airing evidence. */
  const f=episodeFacts(m);if((f.airing&&f.releasedEpisodes==null)||!f.status)try{await ensureIdentity(m)}catch(e){}
  const p=progressEpisodeCounts(m),old=relC[m.id]||{},edges=(m.relations&&m.relations.edges)||[];
  const seq=authoritativeRelations?edges.filter(e=>e.node&&e.relationType==='SEQUEL'&&e.node.type==='ANIME').map(e=>({id:e.node.id,title:e.node.title,cover:(e.node.coverImage&&e.node.coverImage.large)||'',fmt:e.node.format,st:e.node.status,y:e.node.seasonYear})):(old.seq||[]);
  relC[m.id]=Object.assign({},old,{f:Date.now(),pv:2,eps:p.plannedEpisodes,plannedEpisodes:p.plannedEpisodes,
   releasedEpisodes:p.releasedEpisodes,st:episodeFacts(m).status,nextAiringEpisode:m.nextAiringEpisode||null,seq:seq})};
 try{for(let i=0;i<need.length;i+=40){
  const ids=need.slice(i,i+40);let media=[];
  try{const d=await gql(`query($ids:[Int]){Page(perPage:40){media(id_in:$ids,type:ANIME){id idMal title{romaji english native}synonyms episodes status format seasonYear startDate{year month day} nextAiringEpisode{episode} relations{edges{relationType node{id type format status episodes seasonYear title{romaji english} coverImage{large}}}}}}`,{ids:ids});media=(d.Page&&d.Page.media)||[]}catch(e){}
  const queue=ids.slice(),failed=[];
  async function worker(){while(queue.length){const id=queue.shift();try{let m=media.find(x=>x&&String(x.id)===String(id)),primary=!!m;
    if(!m)m=await fbDetail(id);if(!m){failed.push(id);continue}
    await store(m,primary)
   }catch(e){failed.push(id)}}}
  await Promise.all(Array(Math.min(3,queue.length)).fill(0).map(worker));
  if(failed.length)relErr='Could not refresh '+failed.length+' anime. Keeping the last known episode and sequel metadata.';
  try{localStorage.setItem('animeShelfRel',JSON.stringify(relC))}catch(e){}}}
 catch(e){relErr='Could not check progress/sequels: '+emsg(e)+'.'}
 relBusy=false;if(tab=='prog'&&$('#ov').style.display!='block')drawProg();
}

const HOURLY_OPEN_KEY='animeShelfLastOpen';

 /* A single latest-open timestamp replaces the previous one; no history/counter is stored. */

 if(HR.busy){paintRefreshBox();return HR.busy}
 HR.message='Refreshing released episodes and sequels…';
 HR.busy=(async()=>{try{
   /* On startup/resume, wait for the existing cloud restore so newly restored progress is included. */
   if(syncReady)try{await syncReady}catch(e){}
   await loadRel(true);
   try{await ensureProgReleased()}catch(e){}
   HR.message=relErr||'Hourly refresh finished.';
  }catch(e){HR.message='Refresh failed. Cached progress is kept; the next opened hour will retry.'}
  finally{HR.busy=null;paintRefreshBox()}

function themeConflict(kind,key){

  if(TEXT_FAMILY[t.text]===key)return true;
  if(AC_FAMILY[t.ac]===key)return true;
 }
 if(kind==='text'){
  const fam=TEXT_FAMILY[key];
  if(fam&&BG_CLASSIC[t.bg]&&t.bg===fam)return true;
  if(fam&&AC_FAMILY[t.ac]===fam)return true;
 }
 if(kind==='ac'){
  const fam=AC_FAMILY[key];
  if(fam&&BG_CLASSIC[t.bg]&&t.bg===fam)return true;
  if(fam&&TEXT_FAMILY[t.text]===fam)return true;
 }
 return false;
}

async function pullProfiles(){

  if(ch){try{localStorage.setItem('animeShelfProfiles',JSON.stringify(profiles.filter(p=>!p.hidden)))}catch(e){}
   if(!profiles.some(p=>p.id==curP&&!p.hidden))await switchProfile((profiles.find(p=>!p.hidden)||profiles[0]).id);

async function pushProfiles(retry){

       <div class="buf"></div><div class="pos"></div>
     </div>
     <div class="row2" data-ui="1">
       <button class="b js-bw" title="Back 10s" data-act="bw">⏪10</button>
       <button class="b js-pp" title="Play / Pause" data-act="pp">${vid.paused?'▶':'⏸'}</button>
       <button class="b js-fw" title="Forward 10s" data-act="fw">10⏩</button>
       <span class="tm">0:00 / 0:00</span>
       <button class="b js-mu" title="Mute" data-act="mu">${vid.muted?'🔇':'🔊'}</button>
       <input class="vo js-vo" type="range" min="0" max="1" step="0.05" value="${vid.volume}" title="Volume">
       ${ccBtn}
       ${subSel}
       <select class="b js-sp" title="Playback speed">
         ${[0.5,0.75,1,1.25,1.5,2].map(x=>`<option value="${x}" ${x==1?'selected':''}>${x}x</option>`).join('')}
       </select>
       <button class="b js-fs" title="Fullscreen" data-act="fs">⛶</button>
     </div>
   </div>
   <div class="pl__tip pl__tip center"></div>
   <div class="pl__tip pl__tip l"></div>
   <div class="pl__tip pl__tip r"></div>
   <div class="pl__nx"><div>Episode finished</div><button class="btn" onclick="stepEp(1)">Watch Next Episode</button></div>`);
 PB.controls=pl.querySelector('.pl__controls');
 /* delegated clicks: anything inside the control bar with data-act is a real button and STOPS
    propagation, so it does not toggle the overlay on tap. */
 PB.controls.addEventListener('click',PB._onCtlClick,true);
 PB.controls.addEventListener('input',PB._onCtlInput,true);
 /* delegated click on the VIDEO SURFACE itself (not controls, not the seek bar): TOGGLE the overlay.
    The seek bubble also stops propagation so scrubbing shows the controls instead of toggling. */
 /* ---- TAP ANYWHERE ON THE VIDEO SURFACE (not on a control button) ---------------------------------
    This is the bug that made the bar vanish: the surface tap used PB.toggleControls(), so tapping the
    video while the controls were already visible REMOVED them instantly (toggle = hide) — the bar
    disappeared before the user could reach it. A non-button tap now only ever SHOWS the controls and
    (re)starts the very same 3s hide countdown the buttons use: interaction → visible → 3s → hide.
    PB.toggleControls() is KEPT as public API (nothing else called it) but is no longer wired here. */
 const surfaceTap=function(){PB.showControls();PB._syncCenter()};
 vid.addEventListener('click',e=>{if(e.target!==vid)return;surfaceTap()});
 /* Some mobile browsers hand the tap over as touch only. Showing is IDEMPOTENT, so the synthesized
    click that may follow simply re-arms the SAME single timer — it can never toggle anything off. */
 vid.addEventListener('touchend',e=>{if(e.target!==vid)return;PB._markTouch();surfaceTap()},{passive:true});
 PB._bindSeek(pl.querySelector('.pl__seek'));
 /* ---- LARGE CENTER PLAY/PAUSE OVERLAY (added) --------------------------------------------------
    Created ONCE per element: if one somehow survived a teardown it is REUSED, never duplicated.
    The glyph is synced from the MEDIA events (below), never from click state. */
 if(!pl.querySelector('.pl__center')){
  pl.insertAdjacentHTML('beforeend',
   `<div class="pl__center" data-ui="1"><button class="js-cpp" type="button" title="Play / Pause" aria-label="Play / Pause">${vid.paused?'▶':'⏸'}</button></div>`);
 }
 const cbtn=pl.querySelector('.pl__center .js-cpp');
 if(cbtn&&cbtn.dataset.pbBound!=='1'){
  cbtn.dataset.pbBound='1';                  /* one binding per element per render */
  cbtn.addEventListener('click',function(e){
   try{e.stopPropagation()}catch(x){}         /* never double-toggle the overlay / the video */
   if(PB.video)PB.video.togglePlay();
   PB.showControls();PB._syncCenter();
  });
 }
 if(vid.dataset.pbCenterSync!=='1'){
  vid.dataset.pbCenterSync='1';                /* one set of media-sync listeners per element */
  ['play','pause','playing','ended','loadedmetadata','emptied'].forEach(function(kind){
   PB._addListener(vid,kind,function(){PB._syncCenter()});
  });
 }
 PB._syncCenter();
 PB._bindActivity();
};

/* ---- keep the large centre button (and the small bottom one) in sync with the ELEMENT ---------
   The glyph is derived from the media element's own state, refreshed by its media events
   (play / pause / playing / ended / loadedmetadata) — never from a click, so it cannot show the
   wrong state. The bottom control is only re-labelled; nothing about it is removed or rewired. */
PB._syncCenter=function(){
 const pl=document.getElementById('pl');if(!pl)return;
 const el=(this._el&&this._el())||(this.video&&this.video.el)||null;
 const paused=el?!!el.paused:true;
 const b=pl.querySelector('.pl__center .js-cpp');if(b)b.textContent=paused?'▶':'⏸';
 const small=pl.querySelector('.js-pp');if(small)small.textContent=paused?'▶':'⏸';
};
PB._onCtlClick=function(e){
 const btn=e.target.closest('[data-act]');
 const stop=()=>{try{e.stopPropagation()}catch(x){}};
 if(btn){stop();
  switch(btn.dataset.act){
   case'pp':PB.video.togglePlay();break;
   case'bw':PB.video.step(-10);break;
   case'fw':PB.video.step(10);break;
   case'mu':PB.video.toggleMute();break;
   case'cc':PB.video.cycleCC();break;
   case'fs':PB.video.toggleFs();break;
  }
  PB.showControls();
  return;
 }
 if(e.target.closest('.js-subsel'))return;
};
PB._onCtlInput=function(e){
 if(e.target.classList.contains('js-vo'))PB.video.setVolume(+e.target.value);
 else if(e.target.classList.contains('js-sp'))PB.video.setRate(+e.target.value);
 else if(e.target.classList.contains('js-subsel'))PB.video.setSub(+(e.target.value||0));
};
/* The seek bar must accept a CLICK and a DRAG (mouse + touch). It talks to the real DOM element
   through PB._el(), never to the wrapper, and it never lets the gesture reach the video surface
   (which would toggle the overlay instead of scrubbing). */
PB._seekBar=null;
PB._bindSeek=function(bar){if(!bar)return;PB._seekBar=bar;
 const pos=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
 const tip=t=>{const t2=document.querySelector('#pl .pl__tip.center');
  if(!t2)return;t2.textContent=t;t2.style.display='block';clearTimeout(t2._tt);
  t2._tt=PB._addTimer(setTimeout(()=>{t2.style.display='none'},900))};
 const commit=x=>{const el=PB._el();if(!el)return;const d=(isFinite(el.duration)&&el.duration)?el.duration:0;
  try{if(d)el.currentTime=x*d}catch(e){}
  PB._updateSeek();PB.showControls();const t2=document.querySelector('#pl .pl__tip.center');if(t2)t2.style.display='none'};
 let dragging=false;
 bar.addEventListener('pointerdown',e=>{if(!PB._el())return;dragging=true;
  try{e.stopPropagation()}catch(x){}
  try{bar.setPointerCapture&&bar.setPointerCapture(e.pointerId)}catch(x){}
  PB.showControls()},true);
 bar.addEventListener('pointermove',e=>{if(!dragging)return;try{e.stopPropagation()}catch(x){}
  const el=PB._el();const d=(el&&isFinite(el.duration)&&el.duration)?el.duration:0;const x=pos(e);
  tip(PB._fmtT(x*d)+' / '+PB._fmtT(d))},true);
 bar.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;
  try{e.stopPropagation()}catch(x){};commit(pos(e))},true);
 bar.addEventListener('pointercancel',()=>{dragging=false},true);
 bar.addEventListener('click',e=>{try{e.stopPropagation()}catch(x){};if(PB._el())commit(pos(e))},true);
};

/* thin wrapper around the <video> element so the rest of the module talks to a stable API */
PB.attachVideo=function(){
 /* The wrapper is KEPT (it is the module's stable API) — but it is only a thin adapter over
    the real element in `el`. Every accessor tolerates el===null so teardown can never throw. */
 this.video={
  el:null,
  get paused(){return this.el?this.el.paused:true},
  get ended(){return this.el?this.el.ended:false},
  get duration(){return (this.el&&isFinite(this.el.duration))?this.el.duration:0},
  get currentTime(){return this.el?(this.el.currentTime||0):0},
  get muted(){return this.el?this.el.muted:false},
  set muted(v){if(this.el)this.el.muted=!!v},
  get volume(){return this.el?this.el.volume:1},
  set volume(v){if(this.el)this.el.volume=Math.max(0,Math.min(1,v))},
  get playbackRate(){return this.el?this.el.playbackRate:1},
  set playbackRate(v){if(this.el)this.el.playbackRate=+v},
  togglePlay(){if(!this.el)return;
   if(this.el.paused){try{this.el.play().catch(()=>{})}catch(e){}}
   else this.el.pause()},
  step(d){if(!this.el||!isFinite(this.el.duration))return;
   this.el.currentTime=Math.max(0,Math.min(this.el.duration,this.el.currentTime+d))},
  setVolume(v){if(!this.el)return;this.el.volume=Math.max(0,Math.min(1,v));this.el.muted=this.el.volume===0},
  toggleMute(){if(this.el)this.el.muted=!this.el.muted},
  cycleCC(){if(!this.el)return;const ts=[].slice.call(this.el.textTracks||[]);if(!ts.length)return;
   const on=ts.some(t=>t.mode==='showing');
   ts.forEach(t=>{t.mode=on?'disabled':'showing'});
   PB._refreshCC()},
  setRate(r){try{if(this.el)this.el.playbackRate=+r}catch(e){}},
  setSub(i){if(!this.el)return;const ts=[].slice.call(this.el.textTracks||[]);
   ts.forEach((t,idx)=>{t.mode=(idx===+i)?'showing':'disabled'});
   PB._refreshCC()},
  seek(x){if(!this.el)return;this.el.currentTime=x*this.duration;PB._updateSeek()},
  toggleFs(){try{
   const pl=document.getElementById('pl');
   if(document.fullscreenElement)document.exitFullscreen();
   else if((pl&&pl.requestFullscreen)||(this.el&&this.el.requestFullscreen)){((pl||this.el)).requestFullscreen();
  }}catch(e){}},
  detach(){this.el=null}
 };
 return this.video;
};

PB._refreshCC=function(){
 const pl=document.getElementById('pl');if(!pl)return;
 const ts=[];try{const v=PB.video&&PB.video.el;if(v)v.textTracks&&ts.push(...v.textTracks)}catch(e){}
 const ccBtn=pl.querySelector('.js-cc');if(ccBtn){ccBtn.classList.toggle('on',ts.some(t=>t.mode==='showing'))}
 const sel=pl.querySelector('.js-subsel');if(sel){sel.innerHTML=ts.map((t,i)=>`<option value="${i}" ${t.mode==='showing'?'selected':''}>${esc(t.label||t.language||('Track '+(i+1)))}</option>`).join('')}
};
PB._updateSeek=function(){
 const pl=document.getElementById('pl');if(!pl||!PB.video)return;
 const dur=PB.video.duration||0,cur=PB.video.currentTime||0;
 const seek=pl.querySelector('.pl__seek');if(!seek)return;
 seek.querySelector('.pos').style.width=(dur?(cur/dur*100):0)+'%';
 const tm=pl.querySelector('.tm');if(tm)tm.textContent=PB._fmtT(cur)+' / '+PB._fmtT(dur);
 const buf=seek.querySelector('.buf');
 if(PB.video.el&&PB.video.el.buffered&&PB.video.el.buffered.length){
  try{const e=PB.video.el.buffered.end(PB.video.el.buffered.length-1);
   buf.style.width=(dur?(e/dur*100):0)+'%';
  }catch(x){}}
};
PB._fmtT=function(t){t=Math.max(0,t|0);const h=t/3600|0,m=(t%3600)/60|0,s=t%60;return(h?(h+':')+String(m).padStart(2,'0'):m+':')+String(s).padStart(2,'0')};
PB._tip=function(cls,txt){const pl=document.getElementById('pl');if(!pl)return;
 const e=pl.querySelector('.pl__tip.'+cls);if(!e)return;
 e.textContent=txt;e.style.display='block';
 clearTimeout(e._tt);e._tt=setTimeout(()=>e.style.display='none',500);
 PB._addTimer(e._tt);
};

/* ====== BUILD vs IFRAME vs VIDEO ======
   After every await, the element the source is attached to MUST be the element that is on
   screen. PB.cleanupElement() wipes #pl's children but never the container itself. */
PB.bootstrap=function(){let pl=document.getElementById('pl');if(!pl){wdraw();pl=document.getElementById('pl')}return pl};

PB.startSource=async function(s,v,gen,sess){
 const alive=()=>gen===PB._gen&&!!(sess&&sess.check());
 const chk=()=>{if(!alive()){const e=new Error('cancelled');e.__sess=1;throw e}};
 const myGen=++PB._gen;PB._gen=myGen;

 const kind=classifySource(s);
 W.pb=null;W.video=null; // W bridges the legacy list/UI

 if(kind===SOURCE_KIND.PROVIDER_PLAYER){
  chk();
  PB.cleanupElement();
  PB._gen=myGen;
  const pl=document.getElementById('pl');if(!pl)throw layerErr(LAYER.RENDER,'player container missing',{code:'nopl'});
  pl.classList.add('loading');plState('loading','Loading the provider player…');
  /* ---- ANIKOTO: the returned player url is VERIFIED BEFORE IT IS FRAMED. --------------------
     "An iframe was created" and "the iframe fired load" are NOT playback: a provider error
     document is an HTML page too, so it loads perfectly and shows no video. For an AniKoto source
     every candidate url is read first (an ordinary CORS read of the provider's own response — its
     host sends access-control-allow-origin: *). The candidate that answers with the provider's
     player page is framed; a candidate that answers with the file-not-found document is rejected
     and the next candidate / next AniKoto server is used. Nothing here changes how any other
     provider's embed, or any direct media / HLS source, is handled. ----------------------------- */
  const ako=!!(s&&s._ako);
  let useUrl=String((s&&s.url)||''),probe=null,verified=false;
  /* GOGOANIME ONLY pre-frame probe (see gogoProbePlayer). AniKoto keeps its own akoProbeEmbed path. */
  const isGogo=!!((v&&v.provider==='gogoanime')||(s&&s._prov==='gogoanime'));
  if(isGogo&&!ako){
   plState('loading','Checking Gogoanime player page…');
   try{
    const gp=await gogoProbePlayer(useUrl,sess?sess.sig:null);
    diagLog('gogo pre-frame probe',String(gp.ok),String(gp.reason||''),(gp.nests||[]).slice(0,3).join(' | '));
    if(gp.ok==='error-page'){
     PB.cleanupElement();PB._gen=myGen;
     throw layerErr(LAYER.VIDEO,'Gogoanime nested stream is a file-not-found/error document — source not framed',{code:'embed-dead'})}
    if(gp.ok===true)verified=true;
   }catch(e){if(e&&e.code==='embed-dead')throw e;/* inconclusive: frame as before */}
   chk();
  }
  if(ako){
   const cands=akoEmbedCandidates(s);let chosen=null,cp=null;
   for(const cu of cands){
    if(!alive())throw Object.assign(new Error('cancelled'),{__sess:1});
    const pr=await akoProbeEmbed(cu,sess?sess.sig:null,ST_BUDGET.akoProbe);
    akoAdd({phase:'probe',server:String(s._akoServer||''),url:cu,type:akoUrlKind(cu),
     status:pr.status,bytes:pr.bytes,kind:pr.kind,ok:(pr.ok===true?true:(pr.ok==='error-page'?false:null))});
    if(pr.ok===true){chosen=cu;cp=pr;break}
    if(pr.ok!=='error-page'&&!chosen){chosen=cu;cp=pr}
   }
   chk();
   if(!chosen){
    akoAdd({phase:'abandon',server:String(s._akoServer||''),url:String(s.url||''),ok:false,
     reason:'every candidate url answered with the provider file-not-found document — this source is dead for this episode',
     fallback:'next AniKoto server'});
    PB.cleanupElement();PB._gen=myGen;
    throw layerErr(LAYER.VIDEO,'the provider answered with its file-not-found document ('+akoUrlKind(s.url)+') — source not framed',{code:'embed-dead'})
   }
   useUrl=chosen;probe=cp;verified=!!(cp&&cp.ok===true);
   akoAdd({phase:'select',server:String(s._akoServer||''),url:useUrl,type:akoUrlKind(useUrl),ok:verified,
    reason:verified?('player page verified before framing (HTTP '+cp.status+', '+cp.bytes+'B)'):('probe inconclusive'+(cp&&cp.kind?(' — '+cp.kind):'')+' — framed unverified')});
  }
  const f=document.createElement('iframe');
  f.allow='fullscreen; picture-in-picture; autoplay';f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';
  f.src=useUrl;pl.appendChild(f);
  PB.ifr=f;W.video=f;   /* W.video: the SAME element that received the source (decision panel) */
  if(ako)akoAdd({phase:'iframe',server:String(s._akoServer||''),url:useUrl,ok:true,
   reason:'iframe element created and appended to #pl — creation is NOT playback'});
  /* A provider frame is cross-origin, so its own <video> is unreadable from this page (an
     X-Frame-Options / CSP block does not even fire `error`). The ONE deeper signal a provider can
     offer is its own postMessage announcement: when it arrives it is recorded as an OBSERVED
     playback signal. Silence is never reported as playback. */
  let playSig=false,playWhy='';
  try{PB._addListener(window,'message',function(ev){try{
   if(!alive()||playSig)return;
   if(useUrl.indexOf(String(ev.origin||''))!==0)return;
   const d=String((ev.data&&(ev.data.event||ev.data.type||ev.data.state))||ev.data||'');
   if(!/play|timeupdate|loaded|canplay|ready/i.test(d))return;
   playSig=true;playWhy='provider frame announced "'+d.slice(0,44)+'"';
   akoAdd({phase:'playback',server:String(s._akoServer||''),url:useUrl,ok:true,reason:playWhy});
  }catch(e){}})}catch(e){}
  PB._addListener(f,'load',(e)=>{chk();
   try{attAdd({stage:'media',trace:{prov:v.provider,type:'iframe',url:useUrl,host:hostOfUrl(useUrl),
    kind:ako?('player-page'+(verified?' (verified)':' (unverified)')):'player-page',
    hdrRef:hdrGet(s.headers,'referer'),ev:['frame load'],err:null,ok:true,
    delivered:ako?'probed provider player page':'direct iframe'}})}catch(x){}
   pl.classList.remove('loading','err');pl.classList.add('active');
   if(ako)akoAdd({phase:'frame',server:String(s._akoServer||''),url:useUrl,ok:true,
    reason:'frame load event received — LOAD is not playback; the provider player starts its own video'});
   plState('active',ako?(verified?'Provider player verified and loaded — press ▶ in the player if it does not start by itself.':'Provider player attached (unverified) — press ▶ in the player.'):'');
   W.pb={originalUrl:s.url,playbackUrl:useUrl,playbackMode:'embed',needs:[],provider:v.provider,type:'iframe',host:hostOfUrl(useUrl),verified:verified};
   if(alive()){noteSourceOk(v.provider,W.lang);commitActivePlayback(activeArgs(Object.assign({},s,{url:useUrl}),v,'embed'))}
   const pl2=document.getElementById('pl');if(pl2)pl2.classList.remove('ended');
   /* tapping provider iframes shows nothing additional — provider UI handles interaction. */
  });
  /* no embed load within budget → the frame was refused or never answered */
  const grid=setTimeout(()=>{try{chk();
   if(!pl.classList.contains('active')){
    try{attAdd({stage:'media',trace:{prov:v.provider,type:'iframe',url:useUrl,host:hostOfUrl(useUrl),kind:'player-page',
     err:null,ok:false,delivered:'no frame load event'}})}catch(x){}
    if(ako)akoAdd({phase:'timeout',server:String(s._akoServer||''),url:useUrl,ok:false,
     reason:'no frame load event within '+ST_BUDGET.embedLoad+'ms (possible X-Frame-Options / CSP frame-ancestors refusal)',
     fallback:'next AniKoto server'});
    /* no throw here: a throw inside setTimeout is UNCAUGHT and only poisons the console — the
       awaited promise below already rejects with the same frameblocked condition */
   }}catch(e){}/* cancelled by a newer attempt */
  },ST_BUDGET.embedLoad);
  PB._addTimer(grid);
  try{await new Promise((ok,bad)=>{let done=false;
   const fin=er=>{if(done)return;done=true;clearTimeout(grid);er?bad(er):ok()};
   f.addEventListener('load',()=>fin(),{once:true});
   f.addEventListener('error',()=>{if(ako)akoAdd({phase:'frame',server:String(s._akoServer||''),url:useUrl,ok:false,
    reason:'frame error event',fallback:'next AniKoto server'});
    fin(Object.assign(new Error('frame error'),{code:'frameblocked'}))},{once:true});
   PB._addTimer(setTimeout(()=>{if(!pl.classList.contains('active'))fin(Object.assign(new Error('frame load timeout'),{code:'frameblocked'}))},ST_BUDGET.embedLoad));
  });}catch(e){if(ako)akoAdd({phase:'frame',server:String(s._akoServer||''),url:useUrl,ok:false,reason:String((e&&e.message)||e),fallback:'next AniKoto server'});
   PB.cleanupElement();PB._gen=myGen;throw e}
  /* THE OUTCOME IS 'LOADED', NOT 'PLAYING'. This page cannot read a cross-origin provider frame's
     media element, so the honest states are: the provider announced playback (the only observed
     playback signal), or the frame is attached and awaiting play. Never "iframe load = success". */
  const info={playing:playSig,awaitingPlay:!playSig,verified:verified,server:String(s._akoServer||''),url:useUrl,
   state:playSig?(playWhy||'provider reported playback'):(verified?'player page verified — awaiting play':'framed unverified — awaiting play')};
  if(ako)akoAdd({phase:'outcome',server:info.server,url:useUrl,status:200,ok:playSig?true:null,
   reason:info.state,playbackDetected:playSig});
  return info;
 }
 if(kind===SOURCE_KIND.DIRECT_MEDIA){
  chk();
  PB.cleanupElement();
  PB._gen=myGen;
  PB.initDone=false;PB.playCalled=false;PB.autoplayBlocked=false;PB._stallT=0;PB._stallSince=0;
  /* ONE ATTEMPT = ONE TOKEN. Every callback below re-checks cur(). If a fallback (or an episode
     change) has replaced this attempt, the callback is INERT: it can never commit ACTIVE_PLAYBACK,
     never touch the UI, never cancel the attempt that replaced it and never mark it failed. */
  const attemptId=++PB._att;
  const cur=()=>myGen===PB._gen&&PB._att===attemptId&&!!(sess&&sess.check());
  const need=hdrNeed(s.headers);
  const pb=await resolvePlayback(s,v,sess,v.provider); chk();
  W.pb=pb;
  PB._st(PS.SOURCE_RESOLVED,{provider:v.provider,type:s.type,mode:pb.playbackMode,url:String(pb.playbackUrl||'').slice(0,160),needs:pb.needs});
  diag(v.provider,'playback',true,{prov:v.provider,stage:'playback',status:200,rtype:'',ms:0},
   'source RESOLVED — '+(pb.playbackMode==='relay'?'permanent relay URL (the source declares a header a page cannot send: '+(need.join(' + ')||'none')+')':'direct URL (no relay needed)')+(s.type?' · '+s.type:''));
  const pl=document.getElementById('pl');if(!pl)throw layerErr(LAYER.RENDER,'player container missing',{code:'nopl'});
  pl.classList.add('loading');
  plState('loading',need.length?'Routing through the relay…':'Loading the stream…');
  const vid=document.createElement('video');
  vid.playsInline=true;vid.preload='metadata';
  /* DELIBERATELY NO crossOrigin HERE (regression fix).
     crossOrigin='anonymous' turns EVERY media request the element makes into a CORS request. Any
     host that does not answer with Access-Control-Allow-Origin (most anime CDNs, and the relay
     worker) is then rejected by the browser even though the bytes are perfectly playable — so the
     stricter setting was rejecting usable direct MP4/WebM before the element ever tested it. The
     old direct-<video> path never set it, and nothing here needs it:
       • hls.js fetches its manifest and segments itself (XMLHttpRequest + xhrSetup), so the media
         element's CORS mode is irrelevant to the HLS path;
       • native HLS (Safari) loads the playlist through the element, and crossOrigin there has the
         same reject-unplayable-bytes effect;
       • the permanent relay is a plain cross-origin GET that needs no CORS mode to play.
     Removing it restores the permissive old behaviour without weakening any check that matters. */
  pl.insertBefore(vid,pl.firstChild);
  PB.video=PB.attachVideo();PB.video.el=vid;   /* PB.video is the WRAPPER, PB.video.el is the DOM element */
  W.video=vid;

  /* subtitles → <track> elements (kept in DOM so PB can toggle them) */
  (v.subtitles||[]).forEach(t=>{const k=document.createElement('track');
   k.kind='subtitles';k.src=t.url;k.srclang=t.language;k.label=t.label||t.language||'Subtitles';

  if(lab){lab.style.opacity='.45';lab.title='Autoplay next is not available for embed players (AniKoto / Gogoanime)';
   const inp=lab.querySelector('input');if(inp){inp.disabled=true;inp.checked=false}
   lab.childNodes.forEach(n=>{if(n.nodeType===3)n.textContent=' Autoplay next (embeds: off)'})
  }
 }catch(e){}
}
function wtStart(m,ep){m=m||W.m;ep=ep||W.ep;if(!m||!ep)return;wtFinalize(m.id,ep.key);
 const a=A(m.id),k=ep.key,n=ep.number,st=wtClone(a.epst);let top=0;
 const drop=key=>{st[key]='x';const x=parseFloat(key);if(Number.isInteger(x)&&x>top)top=x};
 if(a.cep&&String(a.cep)!==k&&st[a.cep]!=='d'&&!wtImpl(a,a.cep))drop(String(a.cep));
 if(n!=null&&n>1&&m===W.m)mergedEps().forEach(e=>{if(Number.isInteger(e.number)&&e.number>=1&&e.number<n&&!st[e.key]&&!wtImpl(a,e.key))drop(e.key)});
 if(st[k]==='x')delete st[k];
 const p={epst:st,cep:String(k)},tot=epTot(m)||a.eps||0;/* skipped/dropped episodes count as progress */
 if(top>(a.watched||0)&&(!tot||top<=tot))p.watched=top;
 const pn=pnGet();if(!pn||pn.id!=m.id||pn.key!=k)pnSet({id:m.id,key:k,num:n,sec:0,tot:epTot(m)||0,title:ttl(m),cover:m.coverImage.large});
 try{saveLocalWatchPos(m.id,k,n,(pn&&pn.id==m.id&&pn.key==k)?(pn.sec||0):0)}catch(x){}
 wtSet(p,m);if(m===W.m)paintEps()}
function wtDone(m,ep){m=m||W.m;ep=ep||W.ep;if(!m||!ep)return;const a=A(m.id),k=ep.key,n=ep.number,st=wtClone(a.epst);st[k]='d';const p={epst:st,cep:String(k)};
 const tot=epTot(m)||a.eps||0;if(n!=null&&Number.isInteger(n)&&n>=1&&(!tot||n<=tot)&&n>(a.watched||0))p.watched=n;
 wtSet(p,m);if(m===W.m)paintEps()}
/* Play-time rule: an episode that has played >= 2 min counts as watched when you move to ANY other episode (any anime);
   under 2 min it counts as dropped (still advances progress); if you stay it remains 'watching'. Pending episode kept in localStorage. */
const PNK='animeShelfPending',WT_MIN=120,pnGet=()=>stLoad(PNK,null),pnSet=o=>stSave(PNK,o);
/* Local-only watch position (episode key + timeline seconds). Survives browser close.
   Cloud sync keeps only episode-level progress (watched/cep/epst) — never the timeline. */
function saveLocalWatchPos(id,key,num,sec){try{if(!id||!key)return;const all=stLoad(PGK,{})||{};
 const prev=all[id]||{};all[id]={key:String(key),episodeNumber:num!=null?num:prev.episodeNumber,sec:Math.max(0,sec||0),t:Date.now()};
 stSave(PGK,all)}catch(e){}}
function loadLocalWatchPos(id){try{const all=stLoad(PGK,{})||{};return all[id]||null}catch(e){return null}}

const pnM=p=>({id:p.id,title:{english:p.title,romaji:p.title},coverImage:{large:p.cover},episodes:p.tot||0});
function wtDrop(m,ep){const a=A(m.id),k=ep.key,n=ep.number,st=wtClone(a.epst),pr={cep:''};
 if(st[k]!=='d'){if(!wtImpl(a,k))st[k]='x';const tot=epTot(m)||a.eps||0;if(n!=null&&Number.isInteger(n)&&n>=1&&(!tot||n<=tot)&&n>(a.watched||0))pr.watched=n}
 pr.epst=st;wtSet(pr,m)}
function wtFinalize(id,key){const p=pnGet();if(!p||(p.id==id&&p.key==key))return;pnSet(null);
 const m=pnM(p),ep={key:p.key,number:p.num};if(p.sec>=WT_MIN)wtDone(m,ep);else wtDrop(m,ep);wtSet({cep:''},m);if(W.m&&p.id==W.m.id)paintEps()}
function wtTick(m,ep,playing){let acc=0;const flush=()=>{if(!acc)return;const p=pnGet();if(p&&p.id==m.id&&p.key==ep.key){p.sec=(p.sec||0)+acc;pnSet(p);try{saveLocalWatchPos(m.id,ep.key,ep.number,p.sec)}catch(e){}}acc=0};
 W.flush=flush;W.timers.push(setInterval(()=>{if(!document.hidden&&playing()){acc++;if(acc>=3)flush()}},1000))}
function wtCheck(v){if(!v||!v._m||v._d)return;const d=v.duration;if(!d||!isFinite(d))return;
 if(v.ended||v.currentTime>=(d>600?d-180:d*.9)){if(!v._s){v._s=1;wtStart(v._m,v._ep)}v._d=1;wtDone(v._m,v._ep)}}
function trackWatch(v){v._m=W.m;v._ep=W.ep;v._s=0;v._d=0;W._autoNextEmb=null;
 v.addEventListener('playing',()=>{try{if(!v._s){v._s=1;wtStart(v._m,v._ep)}}catch(e){console.warn('[watch]',e)}});
 const chk=()=>{try{wtCheck(v);maybeAutoNextNative()}catch(e){console.warn('[watch]',e)}};
 ['timeupdate','seeked','pause','ended'].forEach(ev=>v.addEventListener(ev,chk));
 v.addEventListener('ended',()=>{try{onEnded()}catch(e){}});
 W.timers.push(setInterval(chk,1000));wtTick(v._m,v._ep,()=>!v.paused&&!v.ended);v.addEventListener('pause',()=>{try{W.flush&&W.flush()}catch(e){}})}
addEventListener('pagehide',()=>{try{wtCheck(W.video)}catch(e){}try{W.flush&&W.flush()}catch(e){}});
(async()=>{if(!st0||!st0.t||st0.root)return;try{if(st0.p)openProfile(true);if(st0.o){await openAnime(st0.o,true);if(st0.w&&cur&&cur.id==st0.o)openWatch(true)}}catch(e){console.warn('[restore]',e)}})();

/* ===== CHARACTER NAME MATCHING (local, no network) =====
   Matches full names, alternative names, prefixes and substrings; ignores case, accents, and
   harmless spacing/punctuation. "z", "zoro" and "roronoa zoro" all find Roroona Zoro. */
function cNames(c){if(!c)return[];const n=c.name;
 if(typeof n==='string')return[n].concat(c.alt||[]).filter(Boolean);
 if(n&&typeof n==='object')return[n.full].concat(n.alternative||[]).filter(Boolean);
 return[]}
function cName(c){const ns=cNames(c);return ns[0]||(c&&typeof c.name==='string'?c.name:'')}
function charNorm(s){return String(s==null?'':s).normalize('NFKC').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function charMatch(c,q){const t=charNorm(q);if(!t)return true;
 return cNames(c).map(charNorm).filter(Boolean).some(n=>n.indexOf(t)>=0||t.split(' ').every(w=>n.indexOf(w)>=0))}
/* Filtering the ALREADY-LOADED characters is a pure grid update: it never rebuilds the overlay and
   never touches the input the user is typing in. */
function charFilter(v){charQ=String(v||'');patchChars()}
/* ===== PROVIDER / AUDIO VISIBILITY STATE (UI only — never removes a provider that is not proven dead) =====
   'ok'       usable now           → normal, selectable
   'checking' not determined yet   → neutral, still selectable (slow/unknown is not unavailable)
   'off'      conclusively unavailable → grayed + disabled */
function serverState(s){if(!s)return'neutral';
 if(s.backendOk===false)return'off';      /* reliable: the backend route is dead */
 if(s.src==='none')return'off';           /* reliable: proven to have no playable source here */
 const res=provRes(s.id),key=W.ep?W.ep.key:null;   /* computed FRESH: a stale snapshot must never keep a button on "checking…" */
 if(res==='off')return'off';              /* reliable: negative identity verdict / empty catalogue */
 if(!key)return res==='checking'?'checking':'unknown';
 if(s.episodeOk)return'ok';
 if(res==='checking')return'checking';
 if(res==='ok')return'off';               /* the provider answered and does NOT list this episode */
 return'unknown'}                         /* failed / timed out: UNKNOWN, never UNAVAILABLE */
function audioStateOf(id,lang){const cfg=ST_CONSUMET.providers[id]||{};
 if(!(cfg.langs||['sub']).includes(lang))return AUDIO_STATE.UNAVAILABLE;
 const key=W.ep?W.ep.key:null;if(!key)return AUDIO_STATE.UNKNOWN;
 const c=candEps(id,key);if(!c.length)return AUDIO_STATE.UNKNOWN;
 if(lang==='dub')return c.some(e=>epAudio(e,id)==='dub')?AUDIO_STATE.AVAILABLE:AUDIO_STATE.UNKNOWN;
 return c.some(e=>{const a=epAudio(e,id);return a==='sub'||a==='unknown'})?AUDIO_STATE.AVAILABLE:AUDIO_STATE.UNKNOWN}
/* 'checking' ONLY while a relevant request is genuinely in flight; once every request has settled
   the state becomes 'ok', 'off' (reliable evidence) or 'unknown' (inconclusive) — never a
   permanent "checking…". A failed request can no longer masquerade as "no dub anywhere". */
function langState(l){const ids=Object.keys(STREAMING_PROVIDERS).filter(id=>(ST_CONSUMET.providers[id]||{}).enabled!==false);
 if(l!=='dub')return'ok';
 if(!ids.some(id=>(ST_CONSUMET.providers[id].langs||['sub']).includes('dub')))return'off';
 if(ids.some(id=>audioStateOf(id,'dub')===AUDIO_STATE.AVAILABLE))return'ok';
 if(discPending())return'checking';
 if(!W.ep)return'unknown';
 const conclusive=ids.length>0&&ids.every(id=>['ok','off'].indexOf(provRes(id))>=0);
 if(!conclusive)return'unknown';
 return ids.some(id=>provRes(id)==='ok'&&(ST_CONSUMET.providers[id].langs||['sub']).includes('dub'))?'off':'unknown'}
function playbackStateOf(){if(ACTIVE_PLAYBACK.providerId)return PLAYBACK_STATE.PLAYING;
 if(W.plan&&W.plan.chain&&W.plan.pi<W.plan.chain.length)return PLAYBACK_STATE.CHECKING;
 if(W.ep&&Object.keys(W.failed||{}).length)return PLAYBACK_STATE.FAILED;
 return PLAYBACK_STATE.NOT_ATTEMPTED}
